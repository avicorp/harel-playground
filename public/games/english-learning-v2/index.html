<!DOCTYPE html>
<html lang="he" dir="rtl">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>לומדים אנגלית 2.0 - Learn English 2.0!</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Rubik:wght@400;600;800;900&display=swap" rel="stylesheet" />
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }

    :root {
      --primary: #6C5CE7;
      --primary-dark: #4B3DC4;
      --accent: #FF7AA2;
      --success: #2ECC71;
      --success-dark: #1F9D55;
      --error: #FF5A5F;
      --error-dark: #D63C41;
      --gold: #FFB800;
      --card-bg: #FFFFFF;
      --text: #2D2A4A;
      --text-light: #7A7799;
      --line: #E6E3F5;
      --radius: 22px;
      --font: 'Rubik', 'Segoe UI', Tahoma, Arial, sans-serif;
    }

    html, body { height: 100%; }
    body {
      font-family: var(--font);
      color: var(--text);
      min-height: 100vh;
      overflow-x: hidden;
      background: #FFF1F4;
      -webkit-tap-highlight-color: transparent;
    }

    /* Floating background blobs */
    .bg-blobs {
      position: fixed; inset: 0; pointer-events: none; z-index: 0; overflow: hidden;
      background: linear-gradient(135deg, #FFF4E0 0%, #FFE3EE 35%, #E6E9FF 70%, #DDF6FF 100%);
    }
    .bg-blob {
      position: absolute; border-radius: 50%; filter: blur(40px); opacity: 0.45;
      animation: drift 18s ease-in-out infinite alternate;
    }
    .bg-blob:nth-child(1) { width: 320px; height: 320px; background: #FFD166; top: -80px; right: -60px; }
    .bg-blob:nth-child(2) { width: 280px; height: 280px; background: #A29BFE; bottom: -60px; left: -60px; animation-delay: -6s; }
    .bg-blob:nth-child(3) { width: 220px; height: 220px; background: #81ECEC; top: 40%; left: 55%; animation-delay: -12s; }
    @keyframes drift {
      from { transform: translate(0, 0) scale(1); }
      to   { transform: translate(40px, 30px) scale(1.15); }
    }

    /* ===== SCREENS ===== */
    .screen {
      display: none; position: relative; z-index: 1;
      width: 100%; min-height: 100vh;
      animation: fadeIn 0.35s ease;
    }
    .screen.active { display: flex; flex-direction: column; align-items: center; }
    @keyframes fadeIn {
      from { opacity: 0; transform: translateY(12px); }
      to   { opacity: 1; transform: translateY(0); }
    }

    /* ===== CHUNKY BUTTON BASE ===== */
    .chunky {
      font-family: var(--font);
      border: none; cursor: pointer;
      border-radius: var(--radius);
      background: var(--card-bg);
      box-shadow: 0 6px 0 var(--line), 0 10px 24px rgba(60, 40, 120, 0.08);
      transition: transform 0.12s, box-shadow 0.12s, background 0.2s;
    }
    .chunky:hover { transform: translateY(-2px); box-shadow: 0 8px 0 var(--line), 0 14px 28px rgba(60, 40, 120, 0.12); }
    .chunky:active { transform: translateY(5px); box-shadow: 0 1px 0 var(--line), 0 4px 10px rgba(60, 40, 120, 0.08); }

    /* ===== WELCOME ===== */
    #welcome-screen { padding: 24px 16px 40px; }
    .hero { text-align: center; margin-bottom: 18px; }
    .hero-mascots { font-size: 3.4em; display: flex; gap: 8px; justify-content: center; }
    .hero-mascots span { display: inline-block; animation: bounce 2.2s ease-in-out infinite; }
    .hero-mascots span:nth-child(2) { animation-delay: 0.25s; }
    .hero-mascots span:nth-child(3) { animation-delay: 0.5s; }
    @keyframes bounce {
      0%, 100% { transform: translateY(0) rotate(0); }
      50% { transform: translateY(-12px) rotate(-6deg); }
    }
    .hero-title {
      font-size: 2.6em; font-weight: 900; line-height: 1.1;
      background: linear-gradient(90deg, #FF6B6B, #FFB800, #2ECC71, #3D9DF2, #6C5CE7, #FF7AA2);
      -webkit-background-clip: text; background-clip: text; color: transparent;
      background-size: 200% auto;
      animation: shine 6s linear infinite;
    }
    @keyframes shine { to { background-position: 200% center; } }
    .hero-sub { font-size: 1.15em; color: var(--text-light); font-weight: 600; direction: ltr; margin-top: 4px; }

    .step {
      width: 100%; max-width: 760px;
      background: rgba(255, 255, 255, 0.55);
      backdrop-filter: blur(10px); -webkit-backdrop-filter: blur(10px);
      border: 2px solid rgba(255, 255, 255, 0.8);
      border-radius: 28px;
      padding: 18px 16px 20px;
      margin-bottom: 16px;
    }
    .step-head { display: flex; align-items: center; gap: 10px; margin-bottom: 14px; }
    .step-num {
      width: 34px; height: 34px; border-radius: 50%;
      background: var(--primary); color: #fff; font-weight: 800;
      display: flex; align-items: center; justify-content: center; flex-shrink: 0;
      box-shadow: 0 3px 0 var(--primary-dark);
    }
    .step.done .step-num { background: var(--success); box-shadow: 0 3px 0 var(--success-dark); }
    .step-title { font-size: 1.2em; font-weight: 800; }

    /* Topics */
    .topic-grid { display: grid; grid-template-columns: repeat(3, 1fr); gap: 12px; }
    .topic-card { padding: 16px 8px 14px; text-align: center; position: relative; color: var(--text); }
    .topic-card .topic-icon { font-size: 2.4em; display: block; margin-bottom: 4px; }
    .topic-card .topic-name-he { font-size: 1em; font-weight: 800; }
    .topic-card .topic-name-en { font-size: 0.8em; color: var(--text-light); direction: ltr; margin-top: 2px; }
    .topic-card .best { font-size: 0.75em; color: var(--gold); font-weight: 800; margin-top: 4px; min-height: 1em; }
    .topic-card.selected {
      background: #F1EEFF;
      box-shadow: 0 6px 0 var(--primary), 0 10px 24px rgba(108, 92, 231, 0.25);
      outline: 3px solid var(--primary); outline-offset: -3px;
    }
    .topic-card.colors-topic {
      background: linear-gradient(#fff, #fff) padding-box,
                  conic-gradient(#FF6B6B, #FFB800, #FFE14D, #2ECC71, #3D9DF2, #6C5CE7, #FF7AA2, #FF6B6B) border-box;
      border: 4px solid transparent;
    }
    .topic-card.colors-topic.selected {
      background: linear-gradient(#FFF6FB, #F1EEFF) padding-box,
                  conic-gradient(#FF6B6B, #FFB800, #FFE14D, #2ECC71, #3D9DF2, #6C5CE7, #FF7AA2, #FF6B6B) border-box;
      outline: none;
    }
    .new-badge {
      position: absolute; top: -8px; right: -6px;
      background: var(--accent); color: #fff; font-size: 0.7em; font-weight: 800;
      padding: 3px 9px; border-radius: 20px; transform: rotate(8deg);
      box-shadow: 0 3px 8px rgba(255, 122, 162, 0.5);
      animation: wiggle 2.5s ease-in-out infinite;
    }
    @keyframes wiggle { 0%, 100% { transform: rotate(8deg); } 50% { transform: rotate(-4deg) scale(1.08); } }
    .mini-speaker {
      position: absolute; top: 6px; left: 6px;
      background: none; border: none; font-size: 1em; cursor: pointer; opacity: 0.45;
      transition: opacity 0.2s, transform 0.2s;
    }
    .mini-speaker:hover { opacity: 1; transform: scale(1.2); }

    /* Modes */
    .mode-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; }
    .mode-card {
      padding: 14px; display: flex; align-items: center; gap: 12px;
      text-align: right; color: var(--text); position: relative;
    }
    .mode-card .mode-icon {
      font-size: 1.8em; width: 52px; height: 52px; flex-shrink: 0;
      border-radius: 16px; background: #F4F2FF;
      display: flex; align-items: center; justify-content: center;
    }
    .mode-card.color-mode .mode-icon { background: linear-gradient(135deg, #FFE3EE, #FFF4C2); }
    .mode-name { font-size: 1em; font-weight: 800; }
    .mode-desc { font-size: 0.8em; color: var(--text-light); margin-top: 2px; line-height: 1.35; }
    .mode-card.selected {
      background: #F1EEFF;
      box-shadow: 0 6px 0 var(--primary), 0 10px 24px rgba(108, 92, 231, 0.25);
      outline: 3px solid var(--primary); outline-offset: -3px;
    }
    .mode-card .new-badge { top: -8px; left: -6px; right: auto; }
    .mode-hint { text-align: center; color: var(--text-light); font-weight: 600; padding: 10px; }

    /* Rounds */
    .round-grid { display: flex; gap: 12px; justify-content: center; }
    .round-card { padding: 12px 22px; min-width: 96px; text-align: center; color: var(--text); }
    .round-card .round-number { font-size: 1.9em; font-weight: 900; color: var(--primary); display: block; line-height: 1; }
    .round-card .round-label { font-size: 0.85em; color: var(--text-light); margin-top: 4px; }
    .round-card.selected {
      background: #F1EEFF;
      box-shadow: 0 6px 0 var(--primary), 0 10px 24px rgba(108, 92, 231, 0.25);
      outline: 3px solid var(--primary); outline-offset: -3px;
    }

    .start-btn {
      font-family: var(--font);
      background: linear-gradient(135deg, #34D77E, var(--success));
      color: #fff; border: none;
      padding: 16px 56px; font-size: 1.35em; font-weight: 900;
      border-radius: 60px; cursor: pointer; margin-top: 6px;
      box-shadow: 0 7px 0 var(--success-dark), 0 12px 26px rgba(46, 204, 113, 0.35);
      transition: transform 0.12s, box-shadow 0.12s, filter 0.2s;
    }
    .start-btn:not(:disabled) { animation: pulse 1.6s ease-in-out infinite; }
    .start-btn:hover:not(:disabled) { filter: brightness(1.05); }
    .start-btn:active:not(:disabled) { transform: translateY(6px); box-shadow: 0 1px 0 var(--success-dark); }
    .start-btn:disabled {
      background: #CFCBE3; box-shadow: 0 7px 0 #B3AECD; cursor: not-allowed; color: #F7F6FC;
    }
    @keyframes pulse { 0%, 100% { scale: 1; } 50% { scale: 1.05; } }

    /* ===== HEADER ===== */
    .header {
      width: 100%;
      position: sticky; top: 0; z-index: 100;
      display: flex; align-items: center; justify-content: space-between; gap: 10px;
      padding: 12px 16px;
      background: rgba(255, 255, 255, 0.7);
      backdrop-filter: blur(12px); -webkit-backdrop-filter: blur(12px);
      border-bottom: 2px solid rgba(255, 255, 255, 0.9);
    }
    .header-btn {
      font-family: var(--font); font-weight: 700; font-size: 0.95em;
      background: #F1EEFF; color: var(--primary); border: none;
      padding: 8px 14px; border-radius: 14px; cursor: pointer;
    }
    .header-btn:hover { background: #E4DFFF; }
    .header-title { font-size: 1.05em; font-weight: 800; text-align: center; flex: 1; }
    .header-stats { display: flex; gap: 8px; align-items: center; }
    .pill {
      display: flex; align-items: center; gap: 4px;
      font-weight: 800; font-size: 1em;
      padding: 6px 12px; border-radius: 20px; background: #fff;
      box-shadow: 0 3px 0 var(--line);
    }
    .pill.score { color: var(--gold); }
    .pill.streak { color: #FF7A00; }
    .pill.streak.hot { animation: popCorrect 0.4s ease; background: #FFF1E0; }

    /* ===== GAME ===== */
    #game-screen { padding-bottom: 30px; }
    .progress-wrap { width: 100%; max-width: 620px; padding: 16px 16px 4px; }
    .progress-meta { display: flex; justify-content: space-between; font-size: 0.9em; color: var(--text-light); font-weight: 700; margin-bottom: 6px; }
    .progress-track { height: 16px; background: rgba(255, 255, 255, 0.8); border-radius: 10px; overflow: hidden; box-shadow: inset 0 2px 4px rgba(0,0,0,0.06); }
    .progress-bar {
      height: 100%; width: 0%;
      background: linear-gradient(90deg, #FF7AA2, #FFB800, #2ECC71, #3D9DF2, #6C5CE7);
      background-size: 620px 100%;
      border-radius: 10px; transition: width 0.45s cubic-bezier(.3,1.4,.6,1);
      position: relative;
    }
    .progress-bar::after {
      content: ''; position: absolute; top: 3px; left: 8px; right: 8px; height: 4px;
      background: rgba(255,255,255,0.45); border-radius: 4px;
    }

    .question-area { width: 100%; max-width: 620px; padding: 10px 16px 0; display: flex; flex-direction: column; align-items: center; }

    .prompt-card {
      width: 100%; background: var(--card-bg); border-radius: 28px;
      padding: 22px 20px 18px; text-align: center; margin-bottom: 20px;
      box-shadow: 0 8px 0 var(--line), 0 16px 34px rgba(60, 40, 120, 0.1);
      animation: promptIn 0.4s cubic-bezier(.3,1.5,.6,1);
    }
    @keyframes promptIn { from { transform: scale(0.85); opacity: 0; } to { transform: scale(1); opacity: 1; } }
    .prompt-question { font-size: 1.1em; color: var(--text-light); font-weight: 700; margin-top: 6px; }
    .prompt-emoji { font-size: 4.6em; display: block; line-height: 1.15; animation: floaty 3s ease-in-out infinite; }
    @keyframes floaty { 0%, 100% { transform: translateY(0); } 50% { transform: translateY(-6px); } }
    .prompt-word { font-size: 2.1em; font-weight: 900; }
    .prompt-word.english { direction: ltr; color: var(--primary); }
    .prompt-word.hebrew { direction: rtl; }

    .speaker-btn {
      font-family: var(--font);
      background: var(--primary); color: #fff; border: none;
      width: 56px; height: 56px; border-radius: 50%; font-size: 1.5em; cursor: pointer;
      display: inline-flex; align-items: center; justify-content: center;
      margin-top: 10px; box-shadow: 0 5px 0 var(--primary-dark);
      transition: transform 0.12s, box-shadow 0.12s;
    }
    .speaker-btn:active { transform: translateY(4px); box-shadow: 0 1px 0 var(--primary-dark); }
    .speaker-btn.big { width: 96px; height: 96px; font-size: 2.6em; animation: ring 2s ease-in-out infinite; }
    @keyframes ring { 0%, 100% { box-shadow: 0 5px 0 var(--primary-dark), 0 0 0 0 rgba(108,92,231,0.45); } 60% { box-shadow: 0 5px 0 var(--primary-dark), 0 0 0 18px rgba(108,92,231,0); } }
    .hint-btn {
      font-family: var(--font); font-weight: 700;
      background: none; border: 2px dashed var(--line); color: var(--text-light);
      padding: 6px 14px; border-radius: 14px; cursor: pointer; margin-top: 10px; margin-inline-start: 8px;
    }

    /* Paint blobs (colors) */
    .swatch {
      display: inline-block; border-radius: 50%;
      box-shadow: inset 0 -8px 0 rgba(0,0,0,0.12), inset 0 6px 10px rgba(255,255,255,0.45), 0 4px 10px rgba(0,0,0,0.12);
      border: 3px solid rgba(0,0,0,0.06);
      vertical-align: middle;
    }
    .swatch.blob { border-radius: 58% 42% 55% 45% / 50% 60% 40% 50%; }
    .prompt-swatch { width: 120px; height: 120px; animation: floaty 3s ease-in-out infinite; }
    .option-swatch { width: 54px; height: 54px; }

    .mix-row { display: flex; align-items: center; justify-content: center; gap: 12px; flex-wrap: wrap; }
    .mix-item { display: flex; flex-direction: column; align-items: center; gap: 4px; }
    .mix-item .swatch { width: 78px; height: 78px; }
    .mix-label { font-weight: 800; direction: ltr; font-size: 1em; }
    .mix-op { font-size: 2em; font-weight: 900; color: var(--text-light); }
    .mix-result {
      width: 78px; height: 78px; border-radius: 50%;
      background: repeating-conic-gradient(#EEE 0 25%, #FFF 0 50%) 50% / 20px 20px;
      display: flex; align-items: center; justify-content: center;
      font-size: 2em; font-weight: 900; color: var(--text-light);
      border: 3px dashed #CCC; transition: background 0.6s, border 0.6s;
    }
    .mix-result.filled { border: 3px solid rgba(0,0,0,0.06); color: transparent; animation: popCorrect 0.5s ease; }

    /* Options */
    .options-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 14px; width: 100%; max-width: 520px; }
    .options-grid.six { grid-template-columns: repeat(3, 1fr); }
    .option-btn {
      padding: 18px 10px; min-height: 84px;
      display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 6px;
      position: relative; font-size: 1.2em; font-weight: 800; color: var(--text);
      animation: optIn 0.35s cubic-bezier(.3,1.5,.6,1) backwards;
    }
    .option-btn:nth-child(2) { animation-delay: 0.05s; }
    .option-btn:nth-child(3) { animation-delay: 0.1s; }
    .option-btn:nth-child(4) { animation-delay: 0.15s; }
    .option-btn:nth-child(5) { animation-delay: 0.2s; }
    .option-btn:nth-child(6) { animation-delay: 0.25s; }
    @keyframes optIn { from { transform: translateY(14px) scale(0.9); opacity: 0; } }
    .option-btn .option-emoji { font-size: 1.9em; line-height: 1; }
    .option-btn .option-text.english { direction: ltr; }
    .option-btn .key-hint {
      position: absolute; bottom: 6px; right: 10px;
      font-size: 0.6em; color: #C5C1DD; font-weight: 700;
    }
    .option-btn .option-speaker {
      position: absolute; top: 6px; left: 6px;
      background: none; border: none; font-size: 0.85em; cursor: pointer; opacity: 0.4;
    }
    .option-btn .option-speaker:hover { opacity: 1; }
    /* Option painted in its color (What color is it?) */
    .option-btn.painted { color: #fff; text-shadow: 0 2px 0 rgba(0,0,0,0.25); }
    .option-btn.painted.light-paint { color: var(--text); text-shadow: none; }

    .option-btn.correct {
      outline: 4px solid var(--success); outline-offset: -4px;
      box-shadow: 0 6px 0 var(--success-dark), 0 10px 24px rgba(46, 204, 113, 0.3);
      animation: popCorrect 0.45s ease;
    }
    .option-btn.correct:not(.painted) { background: #E7FBEF; }
    .option-btn.wrong {
      outline: 4px solid var(--error); outline-offset: -4px;
      box-shadow: 0 6px 0 var(--error-dark);
      animation: shake 0.4s ease;
    }
    .option-btn.wrong:not(.painted) { background: #FFECEC; }
    .option-btn.dim { opacity: 0.45; }
    .options-grid.locked .option-btn { pointer-events: none; }

    @keyframes popCorrect { 0% { transform: scale(1); } 45% { transform: scale(1.1); } 100% { transform: scale(1); } }
    @keyframes shake { 0%, 100% { transform: translateX(0); } 20% { transform: translateX(-9px); } 40% { transform: translateX(9px); } 60% { transform: translateX(-6px); } 80% { transform: translateX(6px); } }

    .feedback {
      margin-top: 18px; padding: 14px 20px; border-radius: 18px;
      font-size: 1.15em; font-weight: 800; text-align: center; width: 100%; max-width: 520px;
      animation: fadeIn 0.3s ease;
    }
    .feedback.correct { background: #E7FBEF; color: var(--success-dark); }
    .feedback.wrong { background: #FFECEC; color: var(--error-dark); }
    .feedback .en { direction: ltr; unicode-bidi: isolate; }
    .next-btn {
      font-family: var(--font); font-weight: 800; font-size: 1.05em;
      margin-top: 12px; padding: 12px 34px; border-radius: 40px; border: none; cursor: pointer;
      background: var(--primary); color: #fff; box-shadow: 0 5px 0 var(--primary-dark);
    }
    .next-btn:active { transform: translateY(4px); box-shadow: 0 1px 0 var(--primary-dark); }

    /* Round banner */
    .round-banner {
      position: fixed; inset: 0; z-index: 200;
      background: rgba(45, 42, 74, 0.45);
      display: flex; align-items: center; justify-content: center;
      animation: fadeIn 0.25s ease;
    }
    .round-banner-content {
      background: #fff; border-radius: 30px; padding: 34px 46px; text-align: center;
      box-shadow: 0 12px 0 var(--line), 0 20px 50px rgba(0,0,0,0.25);
      animation: promptIn 0.45s cubic-bezier(.3,1.5,.6,1);
    }
    .round-banner-emoji { font-size: 3.2em; }
    .round-banner-title { font-size: 1.9em; font-weight: 900; color: var(--primary); }
    .round-banner-sub { font-size: 1.1em; color: var(--text-light); font-weight: 700; margin-top: 4px; }

    /* Floating +10 */
    .float-points {
      position: fixed; z-index: 300; pointer-events: none;
      font-weight: 900; font-size: 1.6em; color: var(--gold);
      text-shadow: 0 2px 0 #fff, 0 3px 8px rgba(0,0,0,0.15);
      animation: floatUp 0.9s ease-out forwards;
    }
    @keyframes floatUp { from { transform: translate(-50%, 0); opacity: 1; } to { transform: translate(-50%, -70px); opacity: 0; } }

    /* ===== RESULTS ===== */
    #results-screen { justify-content: center; padding: 30px 16px; }
    .results-card {
      background: #fff; border-radius: 32px; padding: 32px 26px; text-align: center;
      max-width: 460px; width: 100%;
      box-shadow: 0 10px 0 var(--line), 0 20px 50px rgba(60, 40, 120, 0.15);
      animation: promptIn 0.5s cubic-bezier(.3,1.5,.6,1);
    }
    .results-emoji { font-size: 4.2em; }
    .results-title { font-size: 1.9em; font-weight: 900; }
    .results-subtitle { font-size: 1.1em; color: var(--text-light); font-weight: 600; margin-bottom: 8px; }
    .new-record {
      display: inline-block; background: linear-gradient(135deg, #FFD166, #FFB800);
      color: #6B4A00; font-weight: 900; padding: 6px 16px; border-radius: 20px; margin-bottom: 8px;
      animation: wiggle 1.5s ease-in-out infinite;
    }
    .stars-container { margin: 8px 0 18px; font-size: 2.8em; }
    .star { opacity: 0.18; filter: grayscale(1); display: inline-block; }
    .star.earned { opacity: 1; filter: none; animation: starPop 0.5s ease backwards; }
    @keyframes starPop { 0% { transform: scale(0) rotate(-90deg); opacity: 0; } 60% { transform: scale(1.35) rotate(10deg); } 100% { transform: scale(1); opacity: 1; } }
    .results-stats { display: grid; grid-template-columns: repeat(3, 1fr); gap: 10px; margin-bottom: 22px; }
    .stat { background: #F7F5FF; border-radius: 18px; padding: 12px 6px; }
    .stat-value { font-size: 1.8em; font-weight: 900; color: var(--primary); }
    .stat-label { font-size: 0.8em; color: var(--text-light); font-weight: 700; }
    .results-btns { display: flex; gap: 12px; justify-content: center; flex-wrap: wrap; }

function speak(text, lang) {
  if (!('speechSynthesis' in window)) return;
  window.speechSynthesis.cancel();
  const utter = new SpeechSynthesisUtterance(text);
  utter.lang = lang === 'he' ? 'he-IL' : 'en-US';
  utter.rate = 0.85;
  utter.pitch = 1.1;
  window.speechSynthesis.speak(utter);
}
const speakEnglish = t => speak(t, 'en');
const speakHebrew = t => speak(t, 'he');

let audioCtx = null;
function tone(freq, start, dur, type = 'sine', vol = 0.18) {
  if (!soundOn) return;
  try {
    audioCtx = audioCtx || new (window.AudioContext || window.webkitAudioContext)();
    const t0 = audioCtx.currentTime + start;
    const osc = audioCtx.createOscillator();
    const gain = audioCtx.createGain();
    osc.type = type;
    osc.frequency.setValueAtTime(freq, t0);
    gain.gain.setValueAtTime(0.0001, t0);
    gain.gain.exponentialRampToValueAtTime(vol, t0 + 0.02);
    gain.gain.exponentialRampToValueAtTime(0.0001, t0 + dur);
    osc.connect(gain).connect(audioCtx.destination);
    osc.start(t0);
    osc.stop(t0 + dur + 0.05);
  } catch (e) { /* audio not available */ }
}
const sfx = {

  tap:     () => tone(520, 0, 0.06, 'sine', 0.1),
  win:     () => [523, 659, 784, 1047].forEach((f, i) => tone(f, i * 0.12, 0.25, 'triangle')),
};

    card.addEventListener('click', () => selectTopic(topic.id));
    topicGrid.appendChild(card);
  });

  const roundGrid = document.getElementById('round-grid');
  roundGrid.innerHTML = '';
  ROUND_OPTIONS.forEach(num => {
    const card = el('button', 'chunky round-card', `
      <span class="round-number">${num}</span>
      <div class="round-label">${num === 1 ? 'סיבוב' : 'סיבובים'}</div>`);
    card.dataset.rounds = num;
    card.addEventListener('click', () => selectRounds(num));
    roundGrid.appendChild(card);
  });

  buildModes();
  refreshSelections();
}

function bestLabel(topicId) {
  const best = (store.best || {})[topicId];
  return best ? `🏆 ${best}` : '';
}

function modesForTopic(topicId) {
  return topicId === 'colors' ? ALL_MODES : BASIC_MODES;
}

function buildModes() {
  const modeGrid = document.getElementById('mode-grid');
  modeGrid.innerHTML = '';
  if (!selectedTopic) {
    modeGrid.appendChild(el('div', 'mode-hint', '👆 קודם בוחרים נושא'));
    modeGrid.style.gridTemplateColumns = '1fr';
    return;
  }
  modeGrid.style.gridTemplateColumns = '';
  modesForTopic(selectedTopic).forEach(mode => {
    const card = el('button', 'chunky mode-card' + (mode.color ? ' color-mode' : ''), `
      ${mode.color ? '<span class="new-badge">חדש!</span>' : ''}
      <span class="mode-icon">${mode.icon}</span>
      <div>
        <div class="mode-name">${mode.nameHe}</div>
        <div class="mode-desc">${mode.descHe}</div>
      </div>`);
    card.dataset.id = mode.id;
    card.addEventListener('click', () => selectMode(mode.id));
    modeGrid.appendChild(card);
  });
}

function selectTopic(id) {
  sfx.tap();
  selectedTopic = id;
  if (selectedMode && !modesForTopic(id).some(m => m.id === selectedMode)) selectedMode = null;
  if (id === 'colors' && !selectedMode) selectedMode = 'color-listen';
  buildModes();
  refreshSelections();
}
function selectMode(id) { sfx.tap(); selectedMode = id; refreshSelections(); }
function selectRounds(num) { sfx.tap(); selectedRounds = num; refreshSelections(); }

function refreshSelections() {
  document.querySelectorAll('.topic-card').forEach(c => c.classList.toggle('selected', c.dataset.id === selectedTopic));
  document.querySelectorAll('.mode-card').forEach(c => c.classList.toggle('selected', c.dataset.id === selectedMode));
  document.querySelectorAll('.round-card').forEach(c => c.classList.toggle('selected', parseInt(c.dataset.rounds) === selectedRounds));
  document.getElementById('step-topic').classList.toggle('done', !!selectedTopic);
  document.getElementById('step-mode').classList.toggle('done', !!selectedMode);
  document.getElementById('step-rounds').classList.toggle('done', !!selectedRounds);
  document.getElementById('start-btn').disabled = !(selectedTopic && selectedMode && selectedRounds);
}

// ============================================================
//  QUESTION BUILDERS
//  Each returns { key, prompt: Element, options: [{key, html, cls, style, speakEn}],
//                 columns, autoSpeak(), answerEn, answerHe, onReveal() }
// ============================================================
function buildPool() {
  const topic = TOPICS.find(t => t.id === selectedTopic);
  if (selectedMode === 'color-object') return sample(COLOR_OBJECTS, WORDS_PER_ROUND);
  if (selectedMode === 'color-mix') return sample(COLOR_MIXES, WORDS_PER_ROUND);
  return sample(topic.words, WORDS_PER_ROUND);
}

function makeQuestion(item) {
  const topic = TOPICS.find(t => t.id === selectedTopic);
  const prompt = el('div', 'prompt-card');

  // ---------- COLOR GAMES ----------
  if (selectedMode === 'color-listen') {
    const c = colorById(item.color);
    const choices = shuffleArray([c, ...sample(COLORS.filter(x => x.id !== c.id), 5)]);
    prompt.appendChild(el('div', 'prompt-question', 'איזה צבע שמעתם?'));
    const row = el('div');
    row.appendChild(speakerButton(c.en, 'en', 'speaker-btn big', 'Listen'));
    prompt.appendChild(row);
    const hint = el('button', 'hint-btn', '👀 רמז');
    hint.addEventListener('click', () => { hint.outerHTML = `<div class="prompt-word english" style="font-size:1.5em;margin-top:8px">${c.en}</div>`; });
    prompt.appendChild(hint);
    return {
      key: c.id, prompt, columns: 'six',
      options: choices.map(o => ({ key: o.id, html: swatchHtml(o.id, 'option-swatch') })),
      autoSpeak: () => speakEnglish(c.en),
      answerEn: c.en, answerHe: c.he,
    };
  }

  if (selectedMode === 'color-object') {
    const c = colorById(item.color);
    const choices = shuffleArray([c, ...sample(COLORS.filter(x => x.id !== c.id), 3)]);
    prompt.innerHTML = `
      <span class="prompt-emoji">${item.emoji}</span>
      <div class="prompt-word english" style="font-size:1.5em">${item.en}</div>
      <div class="prompt-question">איזה צבע?</div>`;
    prompt.appendChild(speakerButton(`What color is the ${item.en.toLowerCase()}?`, 'en'));
    return {
      key: c.id, prompt,
      options: choices.map(o => ({
        key: o.id, speakEn: o.en,
        html: `<span class="option-text english">${o.en}</span>`,
        cls: 'painted' + (o.light ? ' light-paint' : ''),
        style: `background:${o.hex}`,
      })),
      autoSpeak: () => speakEnglish(`What color is the ${item.en.toLowerCase()}?`),
      answerEn: `The ${item.en.toLowerCase()} is ${c.en.toLowerCase()}`, answerHe: c.he,
    };
  }

  if (selectedMode === 'color-mix') {
    const a = colorById(item.a), b = colorById(item.b), r = colorById(item.result);
    const wrong = sample(COLORS.filter(x => ![r.id, a.id, b.id].includes(x.id)), 3);
    const choices = shuffleArray([r, ...wrong]);
    prompt.innerHTML = `
      <div class="mix-row">
        <div class="mix-item">${swatchHtml(a.id)}<span class="mix-label">${a.en}</span></div>
        <div class="mix-op">+</div>
        <div class="mix-item">${swatchHtml(b.id)}<span class="mix-label">${b.en}</span></div>
        <div class="mix-op">=</div>
        <div class="mix-item"><div class="mix-result" id="mix-result">?</div><span class="mix-label" id="mix-label">&nbsp;</span></div>
      </div>
      <div class="prompt-question">מה יוצא כשמערבבים?</div>`;
    prompt.appendChild(speakerButton(`${a.en} and ${b.en} make...`, 'en'));
    return {
      key: r.id, prompt,
      options: choices.map(o => ({
        key: o.id, speakEn: o.en,
        html: `${swatchHtml(o.id, 'option-swatch')}<span class="option-text english">${o.en}</span>`,
      })),
      autoSpeak: () => speakEnglish(`${a.en} and ${b.en} make...`),
      answerEn: `${a.en} and ${b.en} make ${r.en.toLowerCase()}`, answerHe: r.he,
      onReveal: () => {
        const res = document.getElementById('mix-result');
        if (!res) return;
        res.style.background = r.hex;
        res.classList.add('filled');
        document.getElementById('mix-label').textContent = r.en;
      },
    };
  }

  // ---------- WORD GAMES (any topic, colors included) ----------
  const word = item;
  const choices = shuffleArray([word, ...sample(topic.words.filter(w => w.en !== word.en), 3)]);
  let autoSpeak = () => {};

  if (selectedMode === 'image-to-english') {
    prompt.innerHTML = `${visualHtml(word, 'prompt')}<div class="prompt-question">מה זה באנגלית?</div>`;
    prompt.appendChild(speakerButton(word.he, 'he', 'speaker-btn', 'שמע בעברית'));
  } else if (selectedMode === 'english-to-hebrew') {
    prompt.innerHTML = `${visualHtml(word, 'prompt')}<div class="prompt-word english">${word.en}</div><div class="prompt-question">מה זה בעברית?</div>`;
    prompt.appendChild(speakerButton(word.en, 'en', 'speaker-btn', 'Listen'));
    autoSpeak = () => speakEnglish(word.en);
  } else {
    prompt.innerHTML = `${visualHtml(word, 'prompt')}<div class="prompt-word hebrew">${word.he}</div><div class="prompt-question">מה זה באנגלית?</div>`;
    prompt.appendChild(speakerButton(word.he, 'he', 'speaker-btn', 'שמע בעברית'));
    autoSpeak = () => speakHebrew(word.he);
  }

  return {
    key: word.en, prompt, autoSpeak,
    options: choices.map(o => {
      if (selectedMode === 'english-to-hebrew') {
        return { key: o.en, speakHe: o.he, html: `<span class="option-text hebrew">${o.he}</span>` };
      }
      const pic = selectedMode === 'image-to-english' ? visualHtml(o, 'option') : '';
      return { key: o.en, speakEn: o.en, html: `${pic}<span class="option-text english">${o.en}</span>` };
    }),
    answerEn: word.en, answerHe: word.he,
  };
}

// ============================================================
//  GAME FLOW
// ============================================================
function startGame() {
  if (!selectedTopic || !selectedMode || !selectedRounds) return;
  document.getElementById('confetti-container').innerHTML = '';
  currentRound = 0; score = 0; correctCount = 0; totalAnswered = 0; streak = 0; bestStreak = 0;
  const topic = TOPICS.find(t => t.id === selectedTopic);
  const mode = ALL_MODES.find(m => m.id === selectedMode);
  document.getElementById('game-header-title').textContent = `${topic.icon} ${topic.nameHe} · ${mode.nameHe}`;
  updateHud();
  showScreen('game-screen');
  startNextRound();
}

function startNextRound() {
  currentRound++;
  if (currentRound > selectedRounds) { showResults(); return; }
  questionQueue = buildPool();
  questionIndex = 0;
  if (selectedRounds > 1) showRoundBanner(currentRound, selectedRounds, showQuestion);
  else showQuestion();
}

function showRoundBanner(round, total, callback) {
  const banner = el('div', 'round-banner', `
    <div class="round-banner-content">
      <div class="round-banner-emoji">${round === total ? '🏁' : '🚩'}</div>
      <div class="round-banner-title">סיבוב ${round} מתוך ${total}</div>
      <div class="round-banner-sub">${round === total ? 'סיבוב אחרון!' : 'יאללה!'}</div>
    </div>`);
  document.body.appendChild(banner);
  setTimeout(() => { banner.remove(); callback(); }, 1400);
}

function showQuestion() {
  if (questionIndex >= questionQueue.length) { startNextRound(); return; }
  isAnswered = false;

  const pct = (questionIndex / questionQueue.length) * 100;
  document.getElementById('progress-bar').style.width = Math.max(pct, 3) + '%';
  document.getElementById('progress-text').textContent = `שאלה ${questionIndex + 1} / ${questionQueue.length}`;
  document.getElementById('round-text').textContent = selectedRounds > 1 ? `סיבוב ${currentRound} / ${selectedRounds}` : '';

  currentQuestion = makeQuestion(questionQueue[questionIndex]);
  const q = currentQuestion;
  const area = document.getElementById('question-area');
  area.innerHTML = '';
  area.appendChild(q.prompt);

  const grid = el('div', 'options-grid' + (q.columns ? ' ' + q.columns : ''));
  q.options.forEach((opt, i) => {
    const btn = el('button', 'chunky option-btn' + (opt.cls ? ' ' + opt.cls : ''), opt.html);
    if (opt.style) btn.setAttribute('style', opt.style);
    btn.dataset.key = opt.key;
    if (opt.speakEn) btn.appendChild(speakerButton(opt.speakEn, 'en', 'option-speaker', 'Listen'));
    if (opt.speakHe) btn.appendChild(speakerButton(opt.speakHe, 'he', 'option-speaker', 'שמע'));
    btn.appendChild(el('span', 'key-hint', String(i + 1)));
    btn.addEventListener('click', () => handleAnswer(btn, opt.key, grid));
    grid.appendChild(btn);
  });
  area.appendChild(grid);

  setTimeout(() => q.autoSpeak && q.autoSpeak(), 250);
}

function handleAnswer(btn, chosenKey, grid) {
  if (isAnswered) return;
  isAnswered = true;
  const q = currentQuestion;
  const area = document.getElementById('question-area');
  const isCorrect = chosenKey === q.key;
  totalAnswered++;
  grid.classList.add('locked');
  if (q.onReveal) q.onReveal();

  if (isCorrect) {
    btn.classList.add('correct');
    correctCount++;
    streak++;
    bestStreak = Math.max(bestStreak, streak);
    const points = 10 + (streak >= 3 ? 5 : 0);
    score += points;
    floatPoints(btn, `+${points}`);
    grid.querySelectorAll('.option-btn').forEach(b => { if (b !== btn) b.classList.add('dim'); });
    const praise = ['מעולה!', 'נכון!', 'כל הכבוד!', 'וואו!', 'אלוף!'][Math.floor(Math.random() * 5)];
    const streakNote = streak >= 3 ? ` · 🔥 ${streak} ברצף` : '';
    area.appendChild(el('div', 'feedback correct', `🎉 ${praise}${streakNote}`));
    sfx.correct();
    setTimeout(() => speakEnglish(q.answerEn), 200);
    advanceTimer = setTimeout(nextQuestion, 1700);
  } else {
    btn.classList.add('wrong');
    streak = 0;
    grid.querySelectorAll('.option-btn').forEach(b => {
      if (b.dataset.key === q.key) b.classList.add('correct');
      else if (b !== btn) b.classList.add('dim');
    });
    area.appendChild(el('div', 'feedback wrong',
      `😕 לא נורא! התשובה: <span class="en">${q.answerEn}</span> = ${q.answerHe}`));
    sfx.wrong();
    setTimeout(() => speakEnglish(q.answerEn), 300);
    // Ask again later in the round
    questionQueue.push(questionQueue[questionIndex]);
    const next = el('button', 'next-btn', 'הבא ←');
    next.addEventListener('click', nextQuestion);
    area.appendChild(next);
    advanceTimer = setTimeout(nextQuestion, 3200);
  }
  updateHud();
}

function nextQuestion() {
  clearTimeout(advanceTimer);
  if (!document.getElementById('game-screen').classList.contains('active')) return;
  questionIndex++;
  showQuestion();
}

function updateHud() {
  document.getElementById('score').textContent = score;
  document.getElementById('streak').textContent = streak;
  const pill = document.getElementById('streak-pill');
  pill.classList.remove('hot');
  if (streak >= 3) { void pill.offsetWidth; pill.classList.add('hot'); }
}

function floatPoints(anchor, text) {
  const r = anchor.getBoundingClientRect();
  const f = el('div', 'float-points', text);
  f.style.left = (r.left + r.width / 2) + 'px';
  f.style.top = (r.top) + 'px';
  document.body.appendChild(f);
  setTimeout(() => f.remove(), 900);
}

// ============================================================
//  RESULTS
// ============================================================
function showResults() {
  clearTimeout(advanceTimer);
  document.getElementById('progress-bar').style.width = '100%';
  const pct = totalAnswered > 0 ? correctCount / totalAnswered : 0;
  const starCount = pct >= 0.9 ? 3 : pct >= 0.7 ? 2 : pct >= 0.4 ? 1 : 0;

  let emoji = '🏆', title = 'מדהים!', subtitle = 'אתם כוכבים באנגלית!';
  if (pct < 0.4)      { emoji = '💪'; title = 'לא מוותרים!'; subtitle = 'נסו שוב, אתם יכולים!'; }
  else if (pct < 0.7) { emoji = '😊'; title = 'לא רע!'; subtitle = 'כמעט שם, עוד פעם!'; }
  else if (pct < 0.9) { emoji = '🌟'; title = 'יופי!'; subtitle = 'עבודה מצוינת!'; }

  document.getElementById('results-emoji').textContent = emoji;
  document.getElementById('results-title').textContent = title;
  document.getElementById('results-subtitle').textContent = subtitle;
  document.getElementById('stat-correct').textContent = correctCount;
  document.getElementById('stat-total').textContent = totalAnswered;
  document.getElementById('stat-streak').textContent = bestStreak;
  document.getElementById('stars-container').innerHTML = [1, 2, 3].map(i =>
    `<span class="star ${i <= starCount ? 'earned' : ''}" style="animation-delay:${i * 0.25}s">⭐</span>`).join('');

  // Best score per topic
  store.best = store.best || {};
  const isRecord = score > 0 && score > (store.best[selectedTopic] || 0);
  if (isRecord) { store.best[selectedTopic] = score; saveStore(store); }
  document.getElementById('record-slot').innerHTML = isRecord ? `<div class="new-record">🏆 שיא חדש: ${score}!</div>` : '';

  showScreen('results-screen');
  if (pct >= 0.7) { launchConfetti(); sfx.win(); }
}

function goHome() {
  clearTimeout(advanceTimer);
  if ('speechSynthesis' in window) window.speechSynthesis.cancel();
  buildWelcome();
  showScreen('welcome-screen');
}

// ============================================================
//  UTILITIES
// ============================================================
function showScreen(id) {
  document.querySelectorAll('.screen').forEach(s => s.classList.remove('active'));
  document.getElementById(id).classList.add('active');
  window.scrollTo(0, 0);
}

function shuffleArray(arr) {
  for (let i = arr.length - 1; i > 0; i--) {
    const j = Math.floor(Math.random() * (i + 1));
    [arr[i], arr[j]] = [arr[j], arr[i]];
  }
  return arr;
}

function launchConfetti() {
  const container = document.getElementById('confetti-container');
  container.innerHTML = '';
  const colors = COLORS.filter(c => c.id !== 'white' && c.id !== 'black').map(c => c.hex);
  for (let i = 0; i < 80; i++) {
    const p = el('div', 'confetti-piece');
    const size = 6 + Math.random() * 10;
    p.style.left = Math.random() * 100 + '%';
    p.style.width = size + 'px';
    p.style.height = size * (Math.random() > 0.5 ? 1 : 0.5) + 'px';
    p.style.background = colors[Math.floor(Math.random() * colors.length)];
    p.style.borderRadius = Math.random() > 0.5 ? '50%' : '3px';
    p.style.animationDelay = Math.random() * 1.5 + 's';
    p.style.animationDuration = (2.2 + Math.random() * 2) + 's';
    container.appendChild(p);
  }
  setTimeout(() => { container.innerHTML = ''; }, 5000);
}

// ============================================================
//  EVENTS + INIT
// ============================================================
document.getElementById('start-btn').addEventListener('click', startGame);
document.getElementById('home-btn').addEventListener('click', goHome);
document.getElementById('results-home-btn').addEventListener('click', goHome);
document.getElementById('replay-btn').addEventListener('click', startGame);

const soundBtn = document.getElementById('sound-toggle');
function renderSoundBtn() { soundBtn.textContent = soundOn ? '🔔' : '🔕'; }
soundBtn.addEventListener('click', () => {
  soundOn = !soundOn;
  store.soundOn = soundOn;
  saveStore(store);
  renderSoundBtn();
  sfx.tap();
});
renderSoundBtn();

// Keyboard: 1-6 to answer, Enter/Space to continue
document.addEventListener('keydown', e => {
  if (!document.getElementById('game-screen').classList.contains('active')) return;
  const n = parseInt(e.key);
  if (!isAnswered && n >= 1) {
    const btns = document.querySelectorAll('#question-area .option-btn');
    if (btns[n - 1]) btns[n - 1].click();
  } else if (isAnswered && (e.key === 'Enter' || e.key === ' ')) {
    e.preventDefault();
    nextQuestion();
  }
});

buildWelcome();
</script>
