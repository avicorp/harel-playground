<!DOCTYPE html>
<html lang="he" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>תקרא לי</title>
  <style>
    :root {
      --bg-primary: #0a1628;
      --bg-secondary: #1a2a4a;
      --bg-card: rgba(255, 255, 255, 0.08);
      --bg-card-hover: rgba(255, 255, 255, 0.12);
      --text-primary: #f0f4ff;
      --text-secondary: #8899bb;
      --text-muted: #556688;
      --btn-read: #4a9eff;
      --btn-syllable: #4ade80;
      --btn-super: #fb923c;
      --btn-easy: #f472b6;
      --btn-read-bg: rgba(74, 158, 255, 0.15);
      --btn-syllable-bg: rgba(74, 222, 128, 0.15);
      --btn-super-bg: rgba(251, 146, 60, 0.15);
      --btn-easy-bg: rgba(244, 114, 182, 0.15);
      --gold: #fbbf24;
      --font-word: 72px;
      --radius: 16px;
      --radius-sm: 10px;
    }

    * { margin: 0; padding: 0; box-sizing: border-box; }

    body {
      font-family: 'David', 'Noto Sans Hebrew', 'Arial', sans-serif;
      background: linear-gradient(135deg, var(--bg-primary), var(--bg-secondary));
      color: var(--text-primary);
      min-height: 100vh;
      user-select: none;
      overflow: hidden;
    }

    .screen {
      display: none;
      width: 100%;
      height: 100vh;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      position: relative;
    }

    .screen.active { display: flex; }

    /* ===== START SCREEN ===== */
    #start-screen .title {
      font-size: 56px;
      font-weight: bold;
      margin-bottom: 8px;
      background: linear-gradient(135deg, var(--btn-read), var(--btn-syllable));
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
    }

    #start-screen .subtitle {
      font-size: 22px;
      color: var(--text-secondary);
      margin-bottom: 40px;
    }

    .character-display {
      width: 180px;
      height: 180px;
      margin-bottom: 30px;
    }

    .character-name-label {
      font-size: 20px;
      color: var(--text-secondary);
      margin-bottom: 6px;
    }

    .character-level-label {
      font-size: 16px;
      color: var(--text-muted);
      margin-bottom: 30px;
    }

    .btn {
      border: none;
      border-radius: var(--radius);
      font-family: inherit;
      font-size: 24px;
      font-weight: bold;
      cursor: pointer;
      padding: 16px 48px;
      transition: transform 0.15s, box-shadow 0.15s;
    }

    .btn:hover { transform: translateY(-2px); }
    .btn:active { transform: translateY(0); }

    .btn-play {
      background: linear-gradient(135deg, var(--btn-read), #2563eb);
      color: white;
      font-size: 32px;
      padding: 20px 64px;
      box-shadow: 0 4px 24px rgba(74, 158, 255, 0.4);
      margin-bottom: 20px;
    }

    .btn-link {
      background: none;
      border: none;
      color: var(--text-secondary);
      font-family: inherit;
      font-size: 18px;
      cursor: pointer;
      padding: 8px 16px;
      text-decoration: underline;
      text-underline-offset: 4px;
    }

    .btn-link:hover { color: var(--text-primary); }

    .start-links { display: flex; gap: 24px; margin-top: 10px; }

    /* ===== GAME SCREEN ===== */
    .game-top-bar {
      position: absolute;
      top: 0;
      left: 0;
      right: 0;
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 16px 24px;
    }

    .top-bar-character {
      display: flex;
      align-items: center;
      gap: 12px;
    }

    .top-bar-avatar {
      width: 48px;
      height: 48px;
    }

    .top-bar-info {
      display: flex;
      flex-direction: column;
    }

    .top-bar-name {
      font-size: 16px;
      font-weight: bold;
    }

    .top-bar-level {
      font-size: 13px;
      color: var(--text-muted);
    }

    .progress-dots {
      display: flex;
      gap: 8px;
      direction: ltr;
    }

    .progress-dot {
      width: 12px;
      height: 12px;
      border-radius: 50%;
      background: var(--bg-card);
      border: 2px solid var(--text-muted);
      transition: all 0.3s;
    }

    .progress-dot.done {
      background: var(--btn-syllable);
      border-color: var(--btn-syllable);
    }

    .progress-dot.current {
      border-color: var(--btn-read);
      box-shadow: 0 0 8px var(--btn-read);
    }

    .word-area {
      flex: 1;
      display: flex;
      align-items: center;
      justify-content: center;
      width: 100%;
      padding: 80px 20px 20px;
    }

    .word-display {
      font-size: var(--font-word);
      font-weight: bold;
      line-height: 1.4;
      text-align: center;
      transition: font-size 0.2s;
      min-height: 120px;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 16px;
      flex-wrap: wrap;
    }

    .syllable {
      display: inline-block;
      transition: all 0.4s ease;
      padding: 0 4px;
      border-radius: 8px;
    }

    .syllable.highlight {
      color: var(--btn-syllable);
      transform: scale(1.3);
      text-shadow: 0 0 20px rgba(74, 222, 128, 0.5);
    }

    .super-size-dots {
      display: flex;
      gap: 6px;
      justify-content: center;
      margin-top: 8px;
      direction: ltr;
    }

    .super-dot {
      width: 10px;
      height: 10px;
      border-radius: 50%;
      background: var(--text-muted);
      transition: all 0.3s;
    }

    .super-dot.filled {
      background: var(--btn-super);
      box-shadow: 0 0 8px var(--btn-super);
    }

    .game-buttons {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 12px;
      padding: 20px 24px 32px;
      width: 100%;
      max-width: 500px;
    }

    .game-btn {
      border: 2px solid;
      border-radius: var(--radius);
      font-family: inherit;
      font-size: 18px;
      font-weight: bold;
      cursor: pointer;
      padding: 16px 12px;
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 8px;
      transition: transform 0.15s, box-shadow 0.15s, background 0.15s;
    }

    .game-btn:hover { transform: translateY(-2px); }
    .game-btn:active { transform: translateY(0); }

    .game-btn svg { width: 32px; height: 32px; }

    .game-btn.read-btn {
      background: var(--btn-read-bg);
      border-color: var(--btn-read);
      color: var(--btn-read);
    }
    .game-btn.read-btn:hover { background: rgba(74, 158, 255, 0.25); }

    .game-btn.syllable-btn {
      background: var(--btn-syllable-bg);
      border-color: var(--btn-syllable);
      color: var(--btn-syllable);
    }
    .game-btn.syllable-btn:hover { background: rgba(74, 222, 128, 0.25); }

    .game-btn.super-btn {
      background: var(--btn-super-bg);
      border-color: var(--btn-super);
      color: var(--btn-super);
    }
    .game-btn.super-btn:hover { background: rgba(251, 146, 60, 0.25); }

    .game-btn.easy-btn {
      background: var(--btn-easy-bg);
      border-color: var(--btn-easy);
      color: var(--btn-easy);
    }
    .game-btn.easy-btn:hover { background: rgba(244, 114, 182, 0.25); }

    .btn-next {
      background: linear-gradient(135deg, var(--btn-read), #2563eb);
      color: white;
      font-size: 22px;
      padding: 14px 40px;
      box-shadow: 0 4px 20px rgba(74, 158, 255, 0.3);
      margin-bottom: 8px;
      visibility: visible;
    }

    .btn-next.hidden { visibility: hidden; }

    /* Reaction bubble */
    .reaction-bubble {
      position: absolute;
      top: 20%;
      background: var(--bg-card);
      border: 2px solid var(--btn-easy);
      border-radius: 20px;
      padding: 16px 28px;
      font-size: 28px;
      color: var(--btn-easy);
      opacity: 0;
      transform: scale(0.5);
      transition: all 0.4s ease;
      pointer-events: none;
      z-index: 10;
    }

    .reaction-bubble.show {
      opacity: 1;
      transform: scale(1);
    }

    /* Speaker pulse animation */
    @keyframes pulse-speaker {
      0%, 100% { transform: scale(1); }
      50% { transform: scale(1.15); }
    }

    .reading .read-btn svg { animation: pulse-speaker 0.6s infinite; }

    /* Explosion animation */
    @keyframes explode {
      0% { transform: scale(1); opacity: 1; }
      50% { transform: scale(2.5); opacity: 0.7; }
      100% { transform: scale(4); opacity: 0; }
    }

    .word-display.exploding {
      animation: explode 0.8s ease-out forwards;
    }

    /* Character animations */
    @keyframes bounce {
      0%, 100% { transform: translateY(0); }
      50% { transform: translateY(-20px); }
    }

    @keyframes spin {
      0% { transform: rotate(0deg); }
      100% { transform: rotate(360deg); }
    }

    @keyframes dance {
      0%, 100% { transform: rotate(0deg) translateY(0); }
      25% { transform: rotate(-10deg) translateY(-10px); }
      75% { transform: rotate(10deg) translateY(-10px); }
    }

    .char-bounce { animation: bounce 0.5s ease 3; }
    .char-spin { animation: spin 0.6s ease; }
    .char-dance { animation: dance 0.4s ease 4; }

    /* ===== COMPLETE SCREEN ===== */
    #complete-screen {
      gap: 20px;
    }

    .complete-character {
      width: 200px;
      height: 200px;
    }

    .complete-title {
      font-size: 42px;
      font-weight: bold;
      background: linear-gradient(135deg, var(--gold), #f59e0b);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
    }

    .complete-subtitle {
      font-size: 20px;
      color: var(--text-secondary);
      margin-bottom: 10px;
    }

    .xp-bar-container {
      width: 300px;
      height: 24px;
      background: var(--bg-card);
      border-radius: 12px;
      overflow: hidden;
      border: 2px solid var(--text-muted);
      margin-bottom: 10px;
    }

    .xp-bar {
      height: 100%;
      background: linear-gradient(90deg, var(--btn-syllable), var(--gold));
      border-radius: 12px;
      transition: width 1s ease;
      width: 0;
    }

    .xp-label {
      font-size: 14px;
      color: var(--text-muted);
      margin-bottom: 20px;
    }

    .level-up-text {
      font-size: 32px;
      color: var(--gold);
      font-weight: bold;
      display: none;
    }

    @keyframes level-up-glow {
      0%, 100% { text-shadow: 0 0 10px var(--gold); }
      50% { text-shadow: 0 0 30px var(--gold), 0 0 60px var(--gold); }
    }

    .level-up-text.show {
      display: block;
      animation: level-up-glow 1s ease 3;
    }

    .unlock-text {
      font-size: 28px;
      color: var(--btn-read);
      font-weight: bold;
      display: none;
    }

    .unlock-text.show { display: block; }

    .complete-buttons {
      display: flex;
      gap: 16px;
      margin-top: 20px;
    }

    .btn-secondary {
      background: var(--bg-card);
      color: var(--text-primary);
      border: 2px solid var(--text-muted);
      font-size: 20px;
      padding: 14px 32px;
    }

    .btn-secondary:hover { background: var(--bg-card-hover); }

    /* ===== QUEST MAP ===== */
    #quest-screen {
      padding: 40px 20px;
      overflow-y: auto;
    }

    .quest-title {
      font-size: 36px;
      font-weight: bold;
      margin-bottom: 8px;
    }

    .quest-subtitle {
      font-size: 16px;
      color: var(--text-secondary);
      margin-bottom: 32px;
    }

    .quest-grid {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 20px;
      max-width: 600px;
      width: 100%;
    }

    .quest-card {
      background: var(--bg-card);
      border-radius: var(--radius);
      padding: 24px;
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 10px;
      border: 2px solid transparent;
      cursor: pointer;
      transition: all 0.3s;
      position: relative;
    }

    .quest-card:hover { background: var(--bg-card-hover); }

    .quest-card.active-char {
      border-color: var(--gold);
      box-shadow: 0 0 20px rgba(251, 191, 36, 0.2);
    }

    .quest-card.locked {
      opacity: 0.5;
      cursor: default;
    }

    .quest-card.locked:hover { background: var(--bg-card); }

    .quest-avatar {
      width: 100px;
      height: 100px;
    }

    .quest-char-name {
      font-size: 20px;
      font-weight: bold;
    }

    .quest-char-level {
      font-size: 14px;
      color: var(--text-muted);
    }

    .quest-progress {
      width: 100%;
      height: 8px;
      background: rgba(255,255,255,0.1);
      border-radius: 4px;
      overflow: hidden;
    }

    .quest-progress-fill {
      height: 100%;
      background: var(--gold);
      border-radius: 4px;
      transition: width 0.5s;
    }

    .quest-lock {
      position: absolute;
      top: 10px;
      left: 10px;
      font-size: 24px;
      color: var(--text-muted);
    }

    .quest-unlock-req {
      font-size: 12px;
      color: var(--text-muted);
    }

    .quest-back {
      margin-top: 32px;
    }

    /* ===== SETTINGS ===== */
    #settings-screen {
      padding: 40px 20px;
      overflow-y: auto;
      gap: 20px;
    }

    .settings-title {
      font-size: 36px;
      font-weight: bold;
    }

    .settings-section {
      background: var(--bg-card);
      border-radius: var(--radius);
      padding: 24px;
      width: 100%;
      max-width: 500px;
    }

    .settings-section h3 {
      font-size: 20px;
      margin-bottom: 16px;
      color: var(--text-secondary);
    }

    .settings-input-group {
      display: flex;
      flex-direction: column;
      gap: 10px;
      margin-bottom: 16px;
    }

    .settings-input {
      background: rgba(255,255,255,0.05);
      border: 1px solid var(--text-muted);
      border-radius: var(--radius-sm);
      padding: 12px 16px;
      font-family: inherit;
      font-size: 18px;
      color: var(--text-primary);
      direction: rtl;
    }

    .settings-input::placeholder { color: var(--text-muted); }
    .settings-input:focus { outline: none; border-color: var(--btn-read); }

    .settings-hint {
      font-size: 13px;
      color: var(--text-muted);
    }

    .btn-add {
      background: var(--btn-syllable-bg);
      color: var(--btn-syllable);
      border: 2px solid var(--btn-syllable);
      font-size: 18px;
      padding: 10px 24px;
      width: 100%;
    }

    .custom-word-list {
      display: flex;
      flex-direction: column;
      gap: 8px;
      margin-top: 16px;
      max-height: 200px;
      overflow-y: auto;
    }

    .custom-word-item {
      display: flex;
      justify-content: space-between;
      align-items: center;
      background: rgba(255,255,255,0.05);
      border-radius: var(--radius-sm);
      padding: 8px 14px;
    }

    .custom-word-text { font-size: 16px; }

    .btn-delete-word {
      background: none;
      border: none;
      color: #ef4444;
      font-size: 20px;
      cursor: pointer;
      padding: 4px 8px;
    }

    .btn-reset {
      background: rgba(239, 68, 68, 0.1);
      color: #ef4444;
      border: 2px solid #ef4444;
      font-size: 16px;
      padding: 10px 24px;
      margin-top: 8px;
    }

    .settings-back { margin-top: 16px; }

    /* Confetti */
    .confetti-container {
      position: fixed;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      pointer-events: none;
      z-index: 100;
    }

    @keyframes confetti-fall {
      0% { transform: translateY(-10vh) rotate(0deg); opacity: 1; }
      100% { transform: translateY(110vh) rotate(720deg); opacity: 0; }
    }

    .confetti-piece {
      position: absolute;
      width: 10px;
      height: 10px;
      animation: confetti-fall 2s ease-in forwards;
    }

    /* Particles for explosion */
    @keyframes particle-out {
      0% { transform: translate(0, 0) scale(1); opacity: 1; }
      100% { opacity: 0; }
    }

    .particle {
      position: absolute;
      width: 8px;
      height: 8px;
      border-radius: 50%;
      pointer-events: none;
    }

    /* ===== FULL TEXT READING ===== */
    .btn-text {
      background: linear-gradient(135deg, var(--btn-super), #ea580c);
      color: white;
      font-size: 24px;
      padding: 14px 40px;
      box-shadow: 0 4px 20px rgba(251, 146, 60, 0.35);
      margin-bottom: 14px;
    }

    #texts-screen {
      padding: 40px 20px;
      overflow-y: auto;
      gap: 20px;
    }

    .texts-title {
      font-size: 36px;
      font-weight: bold;
    }

    .texts-subtitle {
      font-size: 18px;
      color: var(--text-secondary);
    }

    .texts-list {
      display: flex;
      flex-direction: column;
      gap: 16px;
      width: 100%;
      max-width: 560px;
    }

    .text-card {
      background: var(--bg-card);
      border: 2px solid transparent;
      border-radius: var(--radius);
      padding: 20px 24px;
      display: flex;
      align-items: center;
      gap: 18px;
      cursor: pointer;
      transition: all 0.25s;
      text-align: right;
    }

    .text-card:hover {
      background: var(--bg-card-hover);
      border-color: var(--btn-super);
      transform: translateY(-2px);
    }

    .text-card-emoji { font-size: 44px; }

    .text-card-title {
      font-size: 24px;
      font-weight: bold;
    }

    .text-card-meta {
      font-size: 14px;
      color: var(--text-muted);
      margin-top: 4px;
    }

    #text-screen {
      justify-content: flex-start;
    }

    .text-top-bar {
      width: 100%;
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 14px 20px;
      background: rgba(10, 22, 40, 0.85);
      border-bottom: 1px solid rgba(255,255,255,0.08);
      flex-shrink: 0;
      z-index: 2;
    }

    .text-top-title {
      font-size: 22px;
      font-weight: bold;
      color: var(--text-primary);
      text-align: center;
      flex: 1;
      padding: 0 10px;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }

    .text-top-actions {
      display: flex;
      gap: 8px;
      align-items: center;
    }

    .text-icon-btn {
      background: var(--bg-card);
      border: 1px solid rgba(255,255,255,0.15);
      color: var(--text-primary);
      border-radius: var(--radius-sm);
      font-family: inherit;
      font-size: 18px;
      font-weight: bold;
      cursor: pointer;
      padding: 8px 14px;
      transition: background 0.15s;
    }

    .text-icon-btn:hover { background: var(--bg-card-hover); }

    .text-scroll {
      flex: 1;
      width: 100%;
      overflow-y: auto;
      overflow-x: hidden;
      -webkit-overflow-scrolling: touch;
      scroll-behavior: auto;
    }

    .text-page {
      max-width: 820px;
      margin: 0 auto;
      padding: 28px 20px 40px;
    }

    .text-heading {
      font-size: calc(var(--text-font, 44px) * 1.15);
      font-weight: bold;
      text-align: center;
      margin-bottom: 28px;
      color: var(--gold);
      line-height: 1.6;
    }

    .text-subheading {
      font-size: calc(var(--text-font, 44px) * 0.5);
      color: var(--text-secondary);
      text-align: center;
      margin: -14px 0 28px;
    }

    .text-subheading:empty { display: none; }

    .text-paragraph {
      margin-bottom: 26px;
    }

    .text-line {
      font-size: var(--text-font, 44px);
      line-height: 1.75;
      padding: 8px 22px;
      border-radius: 12px;
      color: var(--text-primary);
      font-weight: 500;
      white-space: nowrap;
      letter-spacing: 0.01em;
      word-spacing: 0.25em;
    }

    #text-body.wrap .text-line { white-space: normal; }

    .text-line.odd  { background: rgba(255, 255, 255, 0.10); }
    .text-line.even { background: rgba(74, 158, 255, 0.10); }

    .text-end {
      text-align: center;
      padding: 30px 0 10px;
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 14px;
    }

    .btn-read-done {
      background: linear-gradient(135deg, var(--btn-syllable), #16a34a);
      color: white;
      font-size: 30px;
      padding: 18px 60px;
      box-shadow: 0 4px 24px rgba(74, 222, 128, 0.4);
    }

    .text-read-count {
      font-size: 16px;
      color: var(--text-muted);
    }

    .text-hint {
      font-size: 18px;
      color: var(--text-secondary);
      min-height: 26px;
      transition: opacity 0.3s;
    }

    .text-hint.slow-warning { color: var(--btn-super); }

    /* Fireworks */
    .fireworks-canvas {
      position: fixed;
      inset: 0;
      width: 100%;
      height: 100%;
      pointer-events: none;
      z-index: 200;
    }

    .fireworks-message {
      position: fixed;
      top: 40%;
      left: 50%;
      transform: translate(-50%, -50%) scale(0.6);
      font-size: 54px;
      font-weight: bold;
      color: var(--gold);
      text-shadow: 0 0 20px rgba(251, 191, 36, 0.8), 0 4px 12px rgba(0,0,0,0.6);
      opacity: 0;
      transition: all 0.5s cubic-bezier(0.34, 1.56, 0.64, 1);
      pointer-events: none;
      z-index: 201;
      text-align: center;
      white-space: nowrap;
    }

    .fireworks-message.show {
      opacity: 1;
      transform: translate(-50%, -50%) scale(1);
    }

    @media (max-width: 600px) {
      .text-line { padding: 6px 12px; }

// ===== STATE =====
const STORAGE_KEY = 'readItToMe';
let state = loadState();
let sessionWords = [];
let currentWordIndex = 0;
let superSizeCount = 0;
let currentFontSize = 72;
let syllableAnimating = false;
let actionTaken = false;
let syllableMode = false;
let currentUtterance = null; // Keep reference to prevent GC

function defaultState() {
  return {
    sessionsCompleted: 0,
    activeCharacter: 'gugu',
    characters: {
      gugu: { unlocked: true, level: 1, sessions: 0 },
      drakosh: { unlocked: false, level: 0, sessions: 0 },
      robi: { unlocked: false, level: 0, sessions: 0 },
      yanshufon: { unlocked: false, level: 0, sessions: 0 }
    },
    customWords: [],
    lastSessionDate: null
  };
}

function loadState() {
  try {
    const saved = JSON.parse(localStorage.getItem(STORAGE_KEY));
    if (saved) return saved;
  } catch(e) {}
  return defaultState();
}

function saveState() {
  localStorage.setItem(STORAGE_KEY, JSON.stringify(state));
}

// ===== SCREEN MANAGEMENT =====
const screens = {
  start: document.getElementById('start-screen'),
  game: document.getElementById('game-screen'),
  complete: document.getElementById('complete-screen'),
  quest: document.getElementById('quest-screen'),
  settings: document.getElementById('settings-screen'),
  texts: document.getElementById('texts-screen'),
  text: document.getElementById('text-screen')
};

function showScreen(name) {
  Object.values(screens).forEach(s => s.classList.remove('active'));
  screens[name].classList.add('active');

  if (name === 'start') renderStartScreen();
  if (name === 'quest') renderQuestMap();
  if (name === 'settings') renderSettings();
  if (name === 'texts') renderTextsList();
}

// ===== START SCREEN =====
function renderStartScreen() {
  const char = CHARACTERS[state.activeCharacter];
  const charState = state.characters[state.activeCharacter];
  document.getElementById('start-character').innerHTML = char.svg(charState.level || 1);
  document.getElementById('start-char-name').textContent = char.name;
  document.getElementById('start-char-level').textContent = charState.level > 0 ? `רמה ${charState.level}` : '';
}

// ===== GAME =====
function startGame() {
  // Pick 10 random words
  const allWords = [...WORD_BANK, ...state.customWords.map(w => ({
    word: w.word, syllables: w.syllables, category: 'custom'
  }))];
  sessionWords = shuffle(allWords).slice(0, 10);
  currentWordIndex = 0;

  showScreen('game');
  renderGameTopBar();
  renderProgressDots();
  showWord();
}

function renderGameTopBar() {
  const char = CHARACTERS[state.activeCharacter];
  const charState = state.characters[state.activeCharacter];
  document.getElementById('game-avatar').innerHTML = char.svg(charState.level || 1);
  document.getElementById('game-char-name').textContent = char.name;
  document.getElementById('game-char-level').textContent = `רמה ${charState.level || 1}`;
}

function renderProgressDots() {
  const container = document.getElementById('progress-dots');
  container.innerHTML = '';
  for (let i = 0; i < sessionWords.length; i++) {
    const dot = document.createElement('div');
    dot.className = 'progress-dot';
    if (i < currentWordIndex) dot.classList.add('done');
    if (i === currentWordIndex) dot.classList.add('current');
    container.appendChild(dot);
  }
}

function showWord() {
  if (currentWordIndex >= sessionWords.length) {
    completeSession();
    return;
  }

  const wordData = sessionWords[currentWordIndex];
  const display = document.getElementById('word-display');
  display.className = 'word-display';
  display.textContent = wordData.word;
  currentFontSize = 72;
  display.style.fontSize = currentFontSize + 'px';

  // Reset state
  superSizeCount = 0;
  actionTaken = false;
  syllableMode = false;
  syllableAnimating = false;

  document.getElementById('btn-next').classList.add('hidden');
  document.getElementById('game-buttons').style.display = 'grid';
  document.getElementById('super-dots-container').style.display = 'none';
  document.getElementById('reaction-bubble').classList.remove('show');

  // Remove any character animation
  const avatar = document.getElementById('game-avatar');
  avatar.classList.remove('char-bounce', 'char-spin', 'char-dance');

  renderProgressDots();
}

function showNextButton() {
  document.getElementById('btn-next').classList.remove('hidden');
}

function nextWord() {
  currentWordIndex++;
  showWord();
}

// ===== BUTTON ACTIONS =====

// Read It To Me
function actionRead() {
  if (syllableAnimating) return;

  const wordData = sessionWords[currentWordIndex];
  const gameScreen = document.getElementById('game-screen');

  // Cancel any ongoing speech and reset the engine
  speechSynthesis.cancel();

  // Small delay after cancel to let the engine reset (Chrome bug workaround)
  setTimeout(() => {
    currentUtterance = new SpeechSynthesisUtterance(wordData.speech || wordData.word);
    currentUtterance.lang = 'he-IL';
    currentUtterance.rate = 0.85;

    gameScreen.classList.add('reading');
    currentUtterance.onend = () => {
      gameScreen.classList.remove('reading');
      currentUtterance = null;
      actionTaken = true;
      showNextButton();
    };
    currentUtterance.onerror = () => {
      gameScreen.classList.remove('reading');
      currentUtterance = null;
      actionTaken = true;
      showNextButton();
    };

    speechSynthesis.speak(currentUtterance);
  }, 100);
}

// Split Syllables
function actionSyllables() {
  if (syllableAnimating) return;
  syllableAnimating = true;
  syllableMode = true;

  const wordData = sessionWords[currentWordIndex];
  const display = document.getElementById('word-display');

  // Replace word with syllable spans
  display.innerHTML = '';
  const spans = wordData.syllables.map(syl => {
    const span = document.createElement('span');
    span.className = 'syllable';
    span.textContent = syl;
    span.style.fontSize = currentFontSize + 'px';
    display.appendChild(span);
    return span;
  });

  // Animate syllables sequentially, then repeat once
  animateSyllables(spans, 0, 0);
}

function animateSyllables(spans, index, pass) {
  if (pass >= 2) {
    syllableAnimating = false;
    actionTaken = true;
    showNextButton();
    return;
  }

  if (index >= spans.length) {
    // Start next pass
    setTimeout(() => animateSyllables(spans, 0, pass + 1), 400);
    return;
  }

  // Remove highlight from all
  spans.forEach(s => s.classList.remove('highlight'));
  // Highlight current
  spans[index].classList.add('highlight');

  setTimeout(() => {
    animateSyllables(spans, index + 1, pass);
  }, 600);
}

// Super Size
function actionSuperSize() {
  if (syllableAnimating) return;
  if (superSizeCount >= 5) return;

  superSizeCount++;
  currentFontSize += 10;

  const display = document.getElementById('word-display');

  // Update font size on word or syllable spans
  if (syllableMode) {
    display.querySelectorAll('.syllable').forEach(s => {
      s.style.fontSize = currentFontSize + 'px';
    });
  } else {
    display.style.fontSize = currentFontSize + 'px';
  }

  // Show super size dots
  const dotsContainer = document.getElementById('super-dots-container');
  dotsContainer.style.display = 'flex';
  dotsContainer.innerHTML = '';
  for (let i = 0; i < 5; i++) {
    const dot = document.createElement('div');
    dot.className = 'super-dot' + (i < superSizeCount ? ' filled' : '');
    dotsContainer.appendChild(dot);
  }

  if (superSizeCount >= 5) {
    // Explosion!
    display.classList.add('exploding');
    actionTaken = true;
    setTimeout(() => {
      dotsContainer.style.display = 'none';
      createParticles(display);
      setTimeout(() => {
        currentWordIndex++;
        showWord();
      }, 600);
    }, 800);
  }
}

function createParticles(element) {
  const rect = element.getBoundingClientRect();
  const cx = rect.left + rect.width / 2;
  const cy = rect.top + rect.height / 2;
  const colors = ['#fb923c', '#fbbf24', '#f472b6', '#4ade80', '#4a9eff'];

  for (let i = 0; i < 20; i++) {
    const particle = document.createElement('div');
    particle.className = 'particle';
    particle.style.background = colors[i % colors.length];
    particle.style.left = cx + 'px';
    particle.style.top = cy + 'px';

    const angle = (Math.PI * 2 * i) / 20;
    const distance = 80 + Math.random() * 120;
    const tx = Math.cos(angle) * distance;
    const ty = Math.sin(angle) * distance;

    particle.style.animation = 'none';
    particle.style.transition = 'all 0.8s ease-out';
    document.body.appendChild(particle);

    requestAnimationFrame(() => {
      particle.style.transform = `translate(${tx}px, ${ty}px) scale(0)`;
      particle.style.opacity = '0';
    });

    setTimeout(() => particle.remove(), 1000);
  }
}

// Too Easy
function actionEasy() {
  if (syllableAnimating) return;
  actionTaken = true;

  // Pick random reaction
  const categories = Object.keys(REACTIONS);
  const cat = categories[Math.floor(Math.random() * categories.length)];
  const reactions = REACTIONS[cat];
  const reaction = reactions[Math.floor(Math.random() * reactions.length)];

  // Show reaction bubble
  const bubble = document.getElementById('reaction-bubble');
  bubble.textContent = reaction;
  bubble.classList.add('show');

  // Character animation
  const avatar = document.getElementById('game-avatar');
  const anims = ['char-bounce', 'char-spin', 'char-dance'];
  const anim = anims[Math.floor(Math.random() * anims.length)];
  avatar.classList.remove(...anims);
  void avatar.offsetWidth; // Force reflow
  avatar.classList.add(anim);

  // Confetti for party reactions
  if (cat === 'party') {
    createConfetti();
  }

  // Auto-advance after 1.5s
  setTimeout(() => {
    bubble.classList.remove('show');
    currentWordIndex++;
    showWord();
  }, 1500);
}

function createConfetti() {
  const container = document.createElement('div');
  container.className = 'confetti-container';
  document.body.appendChild(container);

  const colors = ['#fb923c', '#fbbf24', '#f472b6', '#4ade80', '#4a9eff', '#a78bfa'];

  for (let i = 0; i < 30; i++) {
    const piece = document.createElement('div');
    piece.className = 'confetti-piece';
    piece.style.left = Math.random() * 100 + '%';
    piece.style.background = colors[Math.floor(Math.random() * colors.length)];
    piece.style.animationDelay = Math.random() * 0.5 + 's';
    piece.style.animationDuration = 1.5 + Math.random() * 1 + 's';
    if (Math.random() > 0.5) {
      piece.style.borderRadius = '50%';
    }
    container.appendChild(piece);
  }

  setTimeout(() => container.remove(), 3000);
}

// ===== SESSION COMPLETE =====
function completeSession() {
  state.sessionsCompleted++;
  state.lastSessionDate = new Date().toISOString().split('T')[0];

  const activeChar = state.activeCharacter;
  const charState = state.characters[activeChar];
  charState.sessions++;

  // Level up check (every 2 sessions with this character)
  let leveledUp = false;
  if (charState.sessions % 2 === 0 && charState.level < 5) {
    charState.level++;
    leveledUp = true;
  }

  // Unlock check
  let newUnlock = null;
  for (const [key, char] of Object.entries(CHARACTERS)) {
    if (!state.characters[key].unlocked && state.sessionsCompleted >= char.unlockAt) {
      state.characters[key].unlocked = true;
      state.characters[key].level = 1;
      newUnlock = key;
    }
  }

  saveState();

  // Render complete screen
  showScreen('complete');

  const char = CHARACTERS[activeChar];
  document.getElementById('complete-character').innerHTML = char.svg(charState.level);

  document.getElementById('complete-subtitle').textContent =
    `סיימת ${state.sessionsCompleted} משחקים!`;

  // XP bar
  const sessionsToNextLevel = 2;
  const progress = charState.level >= 5 ? 100 : ((charState.sessions % 2) / sessionsToNextLevel * 100);
  setTimeout(() => {
    document.getElementById('xp-bar').style.width = progress + '%';
  }, 300);

  document.getElementById('xp-label').textContent =
    charState.level >= 5 ? `${char.name} ברמה מקסימלית!` : `רמה ${charState.level} — ${charState.sessions % 2}/${sessionsToNextLevel} לרמה הבאה`;

  // Level up
  const levelUpEl = document.getElementById('level-up-text');
  levelUpEl.className = 'level-up-text' + (leveledUp ? ' show' : '');

  // Unlock
  const unlockEl = document.getElementById('unlock-text');
  if (newUnlock) {
    unlockEl.textContent = `!${CHARACTERS[newUnlock].name} נפתח`;
    unlockEl.className = 'unlock-text show';
  } else {
    unlockEl.className = 'unlock-text';
  }

  // Celebration confetti
  createConfetti();
}

// ===== QUEST MAP =====
function renderQuestMap() {
  document.getElementById('quest-sessions').textContent = `סה"כ ${state.sessionsCompleted} משחקים`;

  const grid = document.getElementById('quest-grid');
  grid.innerHTML = '';

  for (const [key, char] of Object.entries(CHARACTERS)) {
    const charState = state.characters[key];
    const card = document.createElement('div');
    card.className = 'quest-card';
    if (key === state.activeCharacter) card.classList.add('active-char');
    if (!charState.unlocked) card.classList.add('locked');

    const avatar = document.createElement('div');
    avatar.className = 'quest-avatar';
    avatar.innerHTML = charState.unlocked ? char.svg(charState.level || 1) :
      `<svg viewBox="0 0 100 100"><text x="50" y="60" text-anchor="middle" font-size="40" fill="#556688">🔒</text></svg>`;

    const name = document.createElement('div');
    name.className = 'quest-char-name';
    name.textContent = char.name;

    const level = document.createElement('div');
    level.className = 'quest-char-level';
    level.textContent = charState.unlocked ? `רמה ${charState.level} • ${char.desc}` : `נפתח ב-${char.unlockAt} משחקים`;

    const progressBar = document.createElement('div');
    progressBar.className = 'quest-progress';
    const fill = document.createElement('div');
    fill.className = 'quest-progress-fill';
    fill.style.width = charState.unlocked ? (charState.level / 5 * 100) + '%' : '0%';
    progressBar.appendChild(fill);

    card.appendChild(avatar);
    card.appendChild(name);
    card.appendChild(level);
    card.appendChild(progressBar);

    if (charState.unlocked) {
      card.onclick = () => {
        state.activeCharacter = key;
        saveState();
        renderQuestMap();
      };
    }

    grid.appendChild(card);
  }
}

// ===== SETTINGS =====
function renderSettings() {
  const list = document.getElementById('custom-word-list');
  list.innerHTML = '';

  state.customWords.forEach((w, i) => {
    const item = document.createElement('div');
    item.className = 'custom-word-item';

    const text = document.createElement('span');
    text.className = 'custom-word-text';
    text.textContent = `${w.word} (${w.syllables.join(' - ')})`;

    const delBtn = document.createElement('button');
    delBtn.className = 'btn-delete-word';
    delBtn.textContent = '✕';
    delBtn.onclick = () => {
      state.customWords.splice(i, 1);
      saveState();
      renderSettings();
    };

    item.appendChild(text);
    item.appendChild(delBtn);
    list.appendChild(item);
  });
}

function addCustomWord() {
  const wordInput = document.getElementById('input-word');
  const sylInput = document.getElementById('input-syllables');

  const word = wordInput.value.trim();
  const syllables = sylInput.value.split(',').map(s => s.trim()).filter(s => s);

  if (!word || syllables.length < 2) return;

  state.customWords.push({ word, syllables });
  saveState();

  wordInput.value = '';
  sylInput.value = '';
  renderSettings();
}

function resetProgress() {
  if (confirm('?האם אתה בטוח שברצונך לאפס את כל ההתקדמות')) {
    state = defaultState();
    saveState();
    renderSettings();
  }
}

// ===== UTILITIES =====
function shuffle(arr) {
  const a = [...arr];
  for (let i = a.length - 1; i > 0; i--) {
    const j = Math.floor(Math.random() * (i + 1));
    [a[i], a[j]] = [a[j], a[i]];
  }
  return a;
}

// Scroll tracking state for the "slow reading" check
const SLOW_SCROLL = {
  maxDownVelocity: 900,   // px/sec — faster than this (going down) counts as "fast"
  minSecPerLine: 0.6,     // minimum seconds per scrolled line to count as real reading
  bottomTolerance: 12,    // px
  topTolerance: 40        // px — returning here re-arms the fireworks
};

let currentStory = null;
let textFontIndex = 4;
let textScroll = {
  armed: true,           // fireworks available on next arrival at the bottom
  fast: false,           // a fast downward scroll was detected since arming
  startTime: null,       // when the reader left the top
  lastTop: 0,
  lastTime: 0,
  samples: []            // recent {t, y} for velocity smoothing
};
let fireworksShow = null; // active show controller, if any

function storyWordCount(story) {
  return story.paragraphs.join(' ').split(/\s+/).filter(Boolean).length;
}

function getTextReads(storyId) {
  if (!state.textReads) state.textReads = {};
  return state.textReads[storyId] || 0;
}

// ----- texts list -----
function renderTextsList() {
  const list = document.getElementById('texts-list');
  list.innerHTML = '';
  STORIES.forEach((story, i) => {
    const card = document.createElement('div');
    card.className = 'text-card';
    card.onclick = () => openTextReader(i);

    const emoji = document.createElement('div');
    emoji.className = 'text-card-emoji';
    emoji.textContent = story.emoji;

    const info = document.createElement('div');
    const title = document.createElement('div');
    title.className = 'text-card-title';
    title.textContent = story.title;
    const meta = document.createElement('div');
    meta.className = 'text-card-meta';
    const reads = getTextReads(story.id);
    meta.textContent = `${storyWordCount(story)} מילים` + (reads ? ` • נקרא ${reads} פעמים` : '');
    info.appendChild(title);
    info.appendChild(meta);

    card.appendChild(emoji);
    card.appendChild(info);
    list.appendChild(card);
  });
}

function openFullText() {
  if (STORIES.length === 1) {
    openTextReader(0);
  } else {
    showScreen('texts');
  }
}

// ----- line splitting -----
// Split a paragraph into lines of at most TEXT_MAX_WORDS words. Sentences are
// kept whole where possible and long sentences are split into balanced chunks.
function splitIntoLines(paragraph, maxWords) {
  const words = paragraph.split(/\s+/).filter(Boolean);
  const sentences = [];
  let current = [];
  words.forEach(w => {
    current.push(w);
    // Sentence ends on . ! ? : (possibly followed by a closing quote)
    if (/[.!?:]["”]?$/.test(w)) {
      sentences.push(current);
      current = [];
    }
  });
  if (current.length) sentences.push(current);

  const lines = [];
  sentences.forEach(sentence => {
    const n = sentence.length;
    const chunks = Math.ceil(n / maxWords);
    const base = Math.floor(n / chunks);
    let extra = n % chunks;
    let idx = 0;
    for (let c = 0; c < chunks; c++) {
      const size = base + (extra > 0 ? 1 : 0);
      if (extra > 0) extra--;
      lines.push(sentence.slice(idx, idx + size).join(' '));
      idx += size;
    }
  });
  return lines;
}

// ----- reader -----
function openTextReader(index) {
  currentStory = STORIES[index];
  showScreen('text');

  document.getElementById('text-top-title').textContent = currentStory.title;
  document.getElementById('text-heading').textContent = currentStory.title;
  document.getElementById('text-subheading').textContent = currentStory.subtitle || '';
  textFontIndex = 4;

  const body = document.getElementById('text-body');
  body.innerHTML = '';
  currentStory.paragraphs.forEach(p => {
    const para = document.createElement('div');
    para.className = 'text-paragraph';
    splitIntoLines(p, TEXT_MAX_WORDS).forEach(lineText => {
      const line = document.createElement('div');
      line.className = 'text-line';
      line.textContent = lineText;
      para.appendChild(line);
    });
    body.appendChild(para);
  });
  restripeLines();

  fitTextFont();
  updateTextReadCount();
  setTextHint('גלול לאט וקרא עד הסוף...');

  const scroller = document.getElementById('text-scroll');
  scroller.scrollTop = 0;
  resetScrollTracking();
}

function closeTextReader() {
  speechSynthesis.cancel();
  showScreen('start');
}

function applyTextFont() {
  document.documentElement.style.setProperty('--text-font', TEXT_FONT_SIZES[textFontIndex] + 'px');
  // If a line is too wide even for one line, let it wrap instead of clipping
  const body = document.getElementById('text-body');
  body.classList.remove('wrap');
  if (linesOverflow()) body.classList.add('wrap');
}

function linesOverflow() {
  const lines = document.querySelectorAll('#text-body .text-line');
  for (const line of lines) {
    if (line.scrollWidth > line.clientWidth + 1) return true;
  }
  return false;
}

// Alternate the line background colors (even / odd) over the whole text
function restripeLines() {
  document.querySelectorAll('#text-body .text-line').forEach((line, i) => {
    line.classList.toggle('even', i % 2 === 0);
    line.classList.toggle('odd', i % 2 === 1);
  });
}

// Make every line fit on one line: first shrink the font (never below the
// comfortable minimum), then split lines that are still too wide in two.
const TEXT_DEFAULT_FONT_INDEX = 4; // 46px
const TEXT_MIN_FIT_FONT_INDEX = 2; // 34px

function fitTextFont() {
  textFontIndex = TEXT_DEFAULT_FONT_INDEX;
  document.getElementById('text-body').classList.remove('wrap');
  document.documentElement.style.setProperty('--text-font', TEXT_FONT_SIZES[textFontIndex] + 'px');
  while (textFontIndex > TEXT_MIN_FIT_FONT_INDEX && linesOverflow()) {
    textFontIndex--;
    document.documentElement.style.setProperty('--text-font', TEXT_FONT_SIZES[textFontIndex] + 'px');
  }
  // Split lines that are still too wide (narrow screens)
  let guard = 0;
  while (linesOverflow() && guard++ < 10) {
    let splitAny = false;
    document.querySelectorAll('#text-body .text-line').forEach(line => {
      if (line.scrollWidth <= line.clientWidth + 1) return;
      const words = line.textContent.trim().split(/\s+/);
      if (words.length < 2) return;
      const half = Math.ceil(words.length / 2);
      const second = document.createElement('div');
      second.className = 'text-line';
      second.textContent = words.slice(half).join(' ');
      line.textContent = words.slice(0, half).join(' ');
      line.after(second);
      splitAny = true;
    });
    if (!splitAny) break;
  }
  restripeLines();
  applyTextFont();
}

function changeTextFont(delta) {
  textFontIndex = Math.max(0, Math.min(TEXT_FONT_SIZES.length - 1, textFontIndex + delta));
  applyTextFont();
}

window.addEventListener('resize', () => {
  if (screens.text.classList.contains('active')) applyTextFont();
});

function updateTextReadCount() {
  const reads = getTextReads(currentStory.id);
  document.getElementById('text-read-count').textContent =
    reads === 0 ? '' : reads === 1 ? 'קראת את הסיפור פעם אחת' : `קראת את הסיפור ${reads} פעמים`;
}

function setTextHint(text, warning) {
  const hint = document.getElementById('text-hint');
  hint.textContent = text;
  hint.className = 'text-hint' + (warning ? ' slow-warning' : '');
}

// ----- slow-scroll detection -----
function resetScrollTracking() {
  const scroller = document.getElementById('text-scroll');
  textScroll.armed = true;
  textScroll.fast = false;
  textScroll.startTime = null;
  textScroll.lastTop = scroller.scrollTop;
  textScroll.lastTime = performance.now();
  textScroll.samples = [];
}

function onTextScroll() {
  const scroller = document.getElementById('text-scroll');
  const now = performance.now();
  const top = scroller.scrollTop;
  const maxTop = scroller.scrollHeight - scroller.clientHeight;

  // Re-arm when the reader comes back to the top
  if (top <= SLOW_SCROLL.topTolerance) {
    if (!textScroll.armed || textScroll.fast) {
      textScroll.armed = true;
      textScroll.fast = false;
      setTextHint('גלול לאט וקרא עד הסוף...');
    }
    textScroll.startTime = null;
    textScroll.samples = [];
  } else if (textScroll.startTime === null) {
    textScroll.startTime = now;
  }

  // Smoothed downward velocity over the last ~250ms
  textScroll.samples.push({ t: now, y: top });
  while (textScroll.samples.length && now - textScroll.samples[0].t > 250) {
    textScroll.samples.shift();
  }
  const first = textScroll.samples[0];
  const dt = (now - first.t) / 1000;
  if (dt > 0.03) {
    const velocity = (top - first.y) / dt; // positive = scrolling down
    if (velocity > SLOW_SCROLL.maxDownVelocity && textScroll.armed && !textScroll.fast) {
      textScroll.fast = true;
      setTextHint('אופס, זה היה מהר מדי! חזור למעלה וקרא לאט 🙂', true);
    }
  }

  textScroll.lastTop = top;
  textScroll.lastTime = now;

  // Reached the bottom?
  if (maxTop > 0 && top >= maxTop - SLOW_SCROLL.bottomTolerance && textScroll.armed) {
    textScroll.armed = false;
    const lineHeight = getLineHeightPx();
    const linesScrolled = Math.max(1, maxTop / lineHeight);
    const elapsedSec = textScroll.startTime ? (now - textScroll.startTime) / 1000 : 0;
    const slowEnough = !textScroll.fast && elapsedSec >= linesScrolled * SLOW_SCROLL.minSecPerLine;

    if (slowEnough) {
      setTextHint('הגעת לסוף! 🎉');
      launchFireworks('כָּל הַכָּבוֹד! קָרָאתָ הַכֹּל! 🎆');
    } else if (!textScroll.fast) {
      textScroll.fast = true;
      setTextHint('אופס, זה היה מהר מדי! חזור למעלה וקרא לאט 🙂', true);
    }
  }
}

function getLineHeightPx() {
  const line = document.querySelector('#text-body .text-line');
  return line ? Math.max(1, line.getBoundingClientRect().height) : 60;
}

// ----- "I read it" button -----
function textReadDone() {
  if (!currentStory) return;
  if (!state.textReads) state.textReads = {};
  state.textReads[currentStory.id] = getTextReads(currentStory.id) + 1;
  saveState();
  updateTextReadCount();
  setTextHint('איזה יופי! 🎉');
  launchFireworks('קָרָאתָ! כָּל הַכָּבוֹד! 🎆');
}

// ----- fireworks show -----
function launchFireworks(message, duration = 4500) {
  // A show is already running: extend it and update the message
  if (fireworksShow) {
    fireworksShow.extend(message, duration);
    return;
  }

  const canvas = document.createElement('canvas');
  canvas.className = 'fireworks-canvas';
  document.body.appendChild(canvas);
  const ctx = canvas.getContext('2d');

  const msgEl = document.createElement('div');
  msgEl.className = 'fireworks-message';
  msgEl.textContent = message;
  document.body.appendChild(msgEl);
  requestAnimationFrame(() => msgEl.classList.add('show'));

  function resize() {
    canvas.width = window.innerWidth * devicePixelRatio;
    canvas.height = window.innerHeight * devicePixelRatio;
    ctx.setTransform(devicePixelRatio, 0, 0, devicePixelRatio, 0, 0);
  }
  resize();
  window.addEventListener('resize', resize);

  const W = () => window.innerWidth;
  const H = () => window.innerHeight;
  const colors = ['#fb923c', '#fbbf24', '#f472b6', '#4ade80', '#4a9eff', '#a78bfa', '#f87171', '#ffffff'];
  const rockets = [];
  const particles = [];
  const start = performance.now();
  let endTime = start + duration;
  let lastLaunch = 0;
  let lastFrame = start;

  fireworksShow = {
    extend(newMessage, extraDuration) {
      endTime = Math.max(endTime, performance.now() + extraDuration);
      msgEl.textContent = newMessage;
      msgEl.classList.add('show');
    }
  };

  function launchRocket() {
    rockets.push({
      x: W() * (0.15 + Math.random() * 0.7),
      y: H(),
      vx: (Math.random() - 0.5) * 60,
      vy: -(H() * 0.9 + Math.random() * H() * 0.4),
      targetY: H() * (0.15 + Math.random() * 0.35),
      color: colors[Math.floor(Math.random() * colors.length)]
    });
  }

  function explode(r) {
    const count = 60 + Math.floor(Math.random() * 40);
    const twoColor = Math.random() > 0.5;
    const c2 = colors[Math.floor(Math.random() * colors.length)];
    for (let i = 0; i < count; i++) {
      const angle = (Math.PI * 2 * i) / count + Math.random() * 0.1;
      const speed = 120 + Math.random() * 260;
      particles.push({
        x: r.x, y: r.y,
        vx: Math.cos(angle) * speed,
        vy: Math.sin(angle) * speed,
        life: 1,
        decay: 0.5 + Math.random() * 0.5,
        size: 2 + Math.random() * 2.5,
        color: twoColor && i % 2 ? c2 : r.color
      });
    }
  }

  function frame(now) {
    const dt = Math.min(0.05, (now - lastFrame) / 1000);
    lastFrame = now;
    const remaining = endTime - now;

    if (remaining > 1200 && now - lastLaunch > 260) {
      launchRocket();
      if (Math.random() > 0.6) launchRocket();
      lastLaunch = now;
    }

    // Fade trail
    ctx.globalCompositeOperation = 'destination-out';
    ctx.fillStyle = 'rgba(0,0,0,0.22)';
    ctx.fillRect(0, 0, W(), H());
    ctx.globalCompositeOperation = 'lighter';

    for (let i = rockets.length - 1; i >= 0; i--) {
      const r = rockets[i];
      r.x += r.vx * dt;
      r.y += r.vy * dt;
      r.vy += 500 * dt;
      ctx.beginPath();
      ctx.arc(r.x, r.y, 3, 0, Math.PI * 2);
      ctx.fillStyle = r.color;
      ctx.fill();
      if (r.y <= r.targetY || r.vy >= -40) {
        explode(r);
        rockets.splice(i, 1);
      }
    }

    for (let i = particles.length - 1; i >= 0; i--) {
      const p = particles[i];
      p.x += p.vx * dt;
      p.y += p.vy * dt;
      p.vy += 220 * dt;
      p.vx *= 0.985;
      p.vy *= 0.985;
      p.life -= p.decay * dt;
      if (p.life <= 0) { particles.splice(i, 1); continue; }
      ctx.globalAlpha = Math.max(0, p.life);
      ctx.beginPath();
      ctx.arc(p.x, p.y, p.size, 0, Math.PI * 2);
      ctx.fillStyle = p.color;
      ctx.fill();
    }
    ctx.globalAlpha = 1;

    if (remaining < 800) msgEl.classList.remove('show');

    if (remaining > 0 || rockets.length || particles.length) {
      requestAnimationFrame(frame);
    } else {
      window.removeEventListener('resize', resize);
      canvas.remove();
      msgEl.remove();
      fireworksShow = null;
    }
  }
  requestAnimationFrame(frame);
}

document.getElementById('text-scroll').addEventListener('scroll', onTextScroll, { passive: true });

// ===== INIT =====
renderStartScreen();
</script>
</body>
</html>
