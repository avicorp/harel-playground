}

// ----- hiriq highlighting -----
const HIRIQ = '\u05B4';
const HEBREW_MARK = /[\u0591-\u05C7]/;

function escapeHtml(str) {
  return str.replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;');
}

// Split text into clusters: a base character plus its nikud marks
function hebrewClusters(text) {
  const clusters = [];
  for (const ch of text) {
    if (HEBREW_MARK.test(ch) && clusters.length) clusters[clusters.length - 1] += ch;
    else clusters.push(ch);
  }
  return clusters;
}

// Wrap every letter with a hiriq in a span. For hiriq male (letter + hiriq
// followed by a bare yod) the yod is highlighted too.
function highlightHiriq(text) {
  const clusters = hebrewClusters(text);
  let html = '';
  for (let i = 0; i < clusters.length; i++) {
    const c = clusters[i];
    if (c.includes(HIRIQ)) {
      let group = c;
      let j = i + 1;
      // a geresh (as in גִ'ינְגֶ'ר) sits between the letter and its yod
      if (clusters[j] === "'" || clusters[j] === '\u05F3') { group += clusters[j]; j++; }
      if (clusters[j] === 'י') { group += clusters[j]; i = j; } // hiriq male: bare yod with no marks
      else if (j > i + 1) { i = j - 1; }
      html += '<span class="hiriq">' + escapeHtml(group) + '</span>';
    } else {
      html += escapeHtml(c);
    }
  }
  return html;
}

function setLineText(el, text) {
  el.dataset.text = text;
  el.innerHTML = highlightHiriq(text);
}

function applyHiriqSetting() {
  const on = state.hiriqHighlight !== false;
  document.getElementById('text-body').classList.toggle('no-hiriq', !on);
  document.getElementById('hiriq-toggle').classList.toggle('off', !on);
}

function toggleHiriq() {
  state.hiriqHighlight = state.hiriqHighlight === false;
  saveState();
  applyHiriqSetting();
}

// Alternate the line background colors (even / odd) over the whole text
function restripeLines() {
  document.querySelectorAll('#text-body .text-line').forEach((line, i) => {
    line.classList.toggle('even', i % 2 === 0);
    line.classList.toggle('odd', i % 2 === 1);
  });
}

// Make every line fit on one line: first shrink the font (never below the
// comfortable minimum), then split lines that are still too wide in two.
const TEXT_DEFAULT_FONT_INDEX = 4; // 46px
const TEXT_MIN_FIT_FONT_INDEX = 2; // 34px

function fitTextFont() {
  textFontIndex = TEXT_DEFAULT_FONT_INDEX;
  document.getElementById('text-body').classList.remove('wrap');
  document.documentElement.style.setProperty('--text-font', TEXT_FONT_SIZES[textFontIndex] + 'px');
  while (textFontIndex > TEXT_MIN_FIT_FONT_INDEX && linesOverflow()) {
    textFontIndex--;
    document.documentElement.style.setProperty('--text-font', TEXT_FONT_SIZES[textFontIndex] + 'px');
  }
  // Split lines that are still too wide (narrow screens)
  let guard = 0;
  while (linesOverflow() && guard++ < 10) {
    let splitAny = false;
    document.querySelectorAll('#text-body .text-line').forEach(line => {
      if (line.scrollWidth <= line.clientWidth + 1) return;
      const words = (line.dataset.text || line.textContent).trim().split(/\s+/);
      if (words.length < 2) return;
      const half = Math.ceil(words.length / 2);
      const second = document.createElement('div');
      second.className = 'text-line';
      setLineText(second, words.slice(half).join(' '));
      setLineText(line, words.slice(0, half).join(' '));
      line.after(second);
      splitAny = true;
    });
    if (!splitAny) break;
  }
  restripeLines();
  applyTextFont();
}

function changeTextFont(delta) {
  textFontIndex = Math.max(0, Math.min(TEXT_FONT_SIZES.length - 1, textFontIndex + delta));
  applyTextFont();
  cacheLineOffsets();
  updateWordCounter();
}

window.addEventListener('resize', () => {
  if (!screens.text.classList.contains('active')) return;
  applyTextFont();
  cacheLineOffsets();
  updateWordCounter();
});

function updateTextReadCount() {
  const reads = getTextReads(currentStory.id);
  document.getElementById('text-read-count').textContent =
    reads === 0 ? '' : reads === 1 ? 'קראת את הסיפור פעם אחת' : `קראת את הסיפור ${reads} פעמים`;
}

function setTextHint(text, warning) {
  const hint = document.getElementById('text-hint');
  hint.textContent = text;
  hint.className = 'text-hint' + (warning ? ' slow-warning' : '');
}

// ----- word counter -----
// Counts the words of every line that has fully scrolled into view.
let lineOffsets = [];      // [{ bottom, words }] in document order, relative to the scroller
let countedWords = 0;
let counterFloat = null;   // the current floating "+N" / "-N" bubble
let counterFloatDelta = 0;
let counterFloatTime = 0;

function cacheLineOffsets() {
  const scroller = document.getElementById('text-scroll');
  const base = scroller.getBoundingClientRect().top - scroller.scrollTop;
  lineOffsets = [...document.querySelectorAll('#text-body .text-line')].map(line => ({
    bottom: line.getBoundingClientRect().bottom - base,
    words: (line.dataset.text || line.textContent).trim().split(/\s+/).filter(Boolean).length
  }));
}

function wordsInView() {
  const scroller = document.getElementById('text-scroll');
  const visibleBottom = scroller.scrollTop + scroller.clientHeight - 4;
  let total = 0;
  for (const line of lineOffsets) {
    if (line.bottom > visibleBottom) break;
    total += line.words;
  }
  return total;
}

function resetWordCounter() {
  countedWords = 0;
  document.getElementById('word-counter-num').textContent = '0';
  const counter = document.getElementById('word-counter');
  counter.classList.remove('happy', 'sad');
  cacheLineOffsets();
}

function updateWordCounter() {
  const target = wordsInView();
  if (target === countedWords) return;
  const delta = target - countedWords;
  countedWords = target;

  const counter = document.getElementById('word-counter');
  document.getElementById('word-counter-num').textContent = String(target);

  // Restart the pop animation: happy going down the text, sad going back up
  counter.classList.remove('happy', 'sad');
  void counter.offsetWidth;
  counter.classList.add(delta > 0 ? 'happy' : 'sad');

  showCounterFloat(delta);
}

function showCounterFloat(delta) {
  const now = performance.now();
  const sameDirection = counterFloat && Math.sign(counterFloatDelta) === Math.sign(delta);
  if (counterFloat && sameDirection && now - counterFloatTime < 250) {
    // Merge quick successive changes into the same bubble
    counterFloatDelta += delta;
    counterFloat.textContent = floatText(counterFloatDelta);
    counterFloatTime = now;
    return;
  }
  const el = document.createElement('div');
  el.className = 'counter-float ' + (delta > 0 ? 'up' : 'down');
  el.textContent = floatText(delta);
  document.getElementById('word-counter').appendChild(el);
  counterFloat = el;
  counterFloatDelta = delta;
  counterFloatTime = now;
  setTimeout(() => {
    el.remove();
    if (counterFloat === el) counterFloat = null;
  }, 1000);
}

function floatText(delta) {
  return delta > 0 ? `+${delta} ✨` : `${delta} 😢`;
}

// ----- slow-scroll detection -----
function resetScrollTracking() {
  const scroller = document.getElementById('text-scroll');
  textScroll.armed = true;
  textScroll.fast = false;
  textScroll.startTime = null;
  textScroll.lastTop = scroller.scrollTop;
  textScroll.lastTime = performance.now();
  textScroll.samples = [];
}

function onTextScroll() {
  updateWordCounter();
  const scroller = document.getElementById('text-scroll');
  const now = performance.now();
  const top = scroller.scrollTop;
  const maxTop = scroller.scrollHeight - scroller.clientHeight;

  // Re-arm when the reader comes back to the top
  if (top <= SLOW_SCROLL.topTolerance) {
    if (!textScroll.armed || textScroll.fast) {
      textScroll.armed = true;
      textScroll.fast = false;
      setTextHint('גלול לאט וקרא עד הסוף...');
    }
    textScroll.startTime = null;
    textScroll.samples = [];
  } else if (textScroll.startTime === null) {
    textScroll.startTime = now;
  }

  // Smoothed downward velocity over the last ~250ms
  textScroll.samples.push({ t: now, y: top });
  while (textScroll.samples.length && now - textScroll.samples[0].t > 250) {
    textScroll.samples.shift();
  }
  const first = textScroll.samples[0];
  const dt = (now - first.t) / 1000;
  if (dt > 0.03) {
    const velocity = (top - first.y) / dt; // positive = scrolling down
    if (velocity > SLOW_SCROLL.maxDownVelocity && textScroll.armed && !textScroll.fast) {
      textScroll.fast = true;
      setTextHint('אופס, זה היה מהר מדי! חזור למעלה וקרא לאט 🙂', true);
    }
  }

  textScroll.lastTop = top;
  textScroll.lastTime = now;

  // Reached the bottom?
  if (maxTop > 0 && top >= maxTop - SLOW_SCROLL.bottomTolerance && textScroll.armed) {
    textScroll.armed = false;
    const lineHeight = getLineHeightPx();
    const linesScrolled = Math.max(1, maxTop / lineHeight);
    const elapsedSec = textScroll.startTime ? (now - textScroll.startTime) / 1000 : 0;
    const slowEnough = !textScroll.fast && elapsedSec >= linesScrolled * SLOW_SCROLL.minSecPerLine;

    if (slowEnough) {
      setTextHint('הגעת לסוף! 🎉');
      launchFireworks('כָּל הַכָּבוֹד! קָרָאתָ הַכֹּל! 🎆');
    } else if (!textScroll.fast) {
      textScroll.fast = true;
      setTextHint('אופס, זה היה מהר מדי! חזור למעלה וקרא לאט 🙂', true);
    }
  }
}

function getLineHeightPx() {
  const line = document.querySelector('#text-body .text-line');
  return line ? Math.max(1, line.getBoundingClientRect().height) : 60;
}

// ----- "I read it" button -----
function textReadDone() {
  if (!currentStory) return;
  if (!state.textReads) state.textReads = {};
  state.textReads[currentStory.id] = getTextReads(currentStory.id) + 1;
  saveState();
  updateTextReadCount();
  setTextHint('איזה יופי! 🎉');
  launchFireworks('קָרָאתָ! כָּל הַכָּבוֹד! 🎆');
}

// ----- fireworks show -----
function launchFireworks(message, duration = 4500) {
  // A show is already running: extend it and update the message
  if (fireworksShow) {
    fireworksShow.extend(message, duration);
    return;
  }

  const canvas = document.createElement('canvas');
  canvas.className = 'fireworks-canvas';
  document.body.appendChild(canvas);
  const ctx = canvas.getContext('2d');

  const msgEl = document.createElement('div');
  msgEl.className = 'fireworks-message';
  msgEl.textContent = message;
  document.body.appendChild(msgEl);
  requestAnimationFrame(() => msgEl.classList.add('show'));

  function resize() {
    canvas.width = window.innerWidth * devicePixelRatio;
    canvas.height = window.innerHeight * devicePixelRatio;
    ctx.setTransform(devicePixelRatio, 0, 0, devicePixelRatio, 0, 0);
  }
  resize();
  window.addEventListener('resize', resize);

  const W = () => window.innerWidth;
  const H = () => window.innerHeight;
  const colors = ['#fb923c', '#fbbf24', '#f472b6', '#4ade80', '#4a9eff', '#a78bfa', '#f87171', '#ffffff'];
  const rockets = [];
  const particles = [];
  const start = performance.now();
  let endTime = start + duration;
  let lastLaunch = 0;
  let lastFrame = start;

  fireworksShow = {
    extend(newMessage, extraDuration) {
      endTime = Math.max(endTime, performance.now() + extraDuration);
      msgEl.textContent = newMessage;
      msgEl.classList.add('show');
    }
  };

  function launchRocket() {
    rockets.push({
      x: W() * (0.15 + Math.random() * 0.7),
      y: H(),
      vx: (Math.random() - 0.5) * 60,
      vy: -(H() * 0.9 + Math.random() * H() * 0.4),
      targetY: H() * (0.15 + Math.random() * 0.35),
      color: colors[Math.floor(Math.random() * colors.length)]
    });
  }

  function explode(r) {
    const count = 60 + Math.floor(Math.random() * 40);
    const twoColor = Math.random() > 0.5;
    const c2 = colors[Math.floor(Math.random() * colors.length)];
    for (let i = 0; i < count; i++) {
      const angle = (Math.PI * 2 * i) / count + Math.random() * 0.1;
      const speed = 120 + Math.random() * 260;
      particles.push({
        x: r.x, y: r.y,
        vx: Math.cos(angle) * speed,
        vy: Math.sin(angle) * speed,
        life: 1,
        decay: 0.5 + Math.random() * 0.5,
        size: 2 + Math.random() * 2.5,
        color: twoColor && i % 2 ? c2 : r.color
      });
    }
  }

  function frame(now) {
    const dt = Math.min(0.05, (now - lastFrame) / 1000);
    lastFrame = now;
    const remaining = endTime - now;

    if (remaining > 1200 && now - lastLaunch > 260) {
      launchRocket();
      if (Math.random() > 0.6) launchRocket();
      lastLaunch = now;
    }

    // Fade trail
    ctx.globalCompositeOperation = 'destination-out';
    ctx.fillStyle = 'rgba(0,0,0,0.22)';
    ctx.fillRect(0, 0, W(), H());
    ctx.globalCompositeOperation = 'lighter';

    for (let i = rockets.length - 1; i >= 0; i--) {
      const r = rockets[i];
      r.x += r.vx * dt;
      r.y += r.vy * dt;
      r.vy += 500 * dt;
      ctx.beginPath();
      ctx.arc(r.x, r.y, 3, 0, Math.PI * 2);
      ctx.fillStyle = r.color;
      ctx.fill();
      if (r.y <= r.targetY || r.vy >= -40) {
        explode(r);
        rockets.splice(i, 1);
      }
    }

    for (let i = particles.length - 1; i >= 0; i--) {
      const p = particles[i];
      p.x += p.vx * dt;
      p.y += p.vy * dt;
      p.vy += 220 * dt;
      p.vx *= 0.985;
      p.vy *= 0.985;
      p.life -= p.decay * dt;
      if (p.life <= 0) { particles.splice(i, 1); continue; }
      ctx.globalAlpha = Math.max(0, p.life);
      ctx.beginPath();
      ctx.arc(p.x, p.y, p.size, 0, Math.PI * 2);
      ctx.fillStyle = p.color;
      ctx.fill();
    }
    ctx.globalAlpha = 1;

    if (remaining < 800) msgEl.classList.remove('show');

    if (remaining > 0 || rockets.length || particles.length) {
      requestAnimationFrame(frame);
    } else {
      window.removeEventListener('resize', resize);
      canvas.remove();
      msgEl.remove();
      fireworksShow = null;
    }
  }
  requestAnimationFrame(frame);
}

// ===== STORY QUIZ =====
// A story may carry a `quiz` array: 'mc' (one of four), 'open' (free text,
// scored by keyword groups) and 'fill' (four sentences, drag words from a
// bank). Every question is worth 10 points; answers are checked only at the end.
const QUIZ_POINTS = 10;
const QUIZ_LETTERS = ['א', 'ב', 'ג', 'ד'];
const QUIZ_KIND_LABELS = {
  mc: 'בְּחִירָה: סַמְּנוּ תְּשׁוּבָה אַחַת',
  open: 'שְׁאֵלָה פְּתוּחָה: כִּתְבוּ בְּמִלִּים שֶׁלָּכֶם',
  fill: 'הַשְׁלָמַת מִשְׁפָּטִים: גִּרְרוּ מִלָּה מֵהַמַּחְסָן'
};

let quiz = null;      // { storyIndex, items, answers, index, submitted }
let quizDrag = null;  // active drag of a word chip
let quizSelectedWord = null; // tap-to-place fallback

function getQuizBest(storyId) {
  return (state.quizBest && state.quizBest[storyId] != null) ? state.quizBest[storyId] : null;
}

function updateQuizButton() {
  const btn = document.getElementById('text-quiz-btn');
  const best = document.getElementById('text-quiz-best');
  const has = currentStory && currentStory.quiz;
  btn.style.display = has ? '' : 'none';
  const b = has ? getQuizBest(currentStory.id) : null;
  best.textContent = b != null ? `הַצִּיּוּן הֲכִי טוֹב שֶׁלְּךָ: ${b}` : '';
}

function buildQuiz(storyIndex) {
  const story = STORIES[storyIndex];
  const items = story.quiz.map(src => {
    if (src.type === 'mc') {
      const options = shuffle(src.options.map((text, i) => ({ text, correct: i === src.answer })));
      return { ...src, options };
    }
    if (src.type === 'fill') {
      const words = src.sentences.map(s => s.answer).concat(src.extra || []);
      const bank = shuffle(words.map((text, id) => ({ id, text })));
      const sentences = src.sentences.map((s, i) => ({ text: s.text, answerId: i }));
      return { ...src, sentences, bank };
    }
    return { ...src };
  });
  const answers = items.map(it => it.type === 'fill' ? it.sentences.map(() => null)
    : it.type === 'open' ? '' : null);
  return { storyIndex, items, answers, index: 0, submitted: false };
}

function startQuiz() {
  const idx = STORIES.indexOf(currentStory);
  if (idx < 0 || !currentStory.quiz) return;
  speechSynthesis.cancel();
  if (!quiz || quiz.storyIndex !== idx || quiz.submitted) quiz = buildQuiz(idx);
  quizSelectedWord = null;
  showScreen('quiz');
  document.getElementById('quiz-top-title').textContent = 'שְׁאֵלוֹת: ' + currentStory.title;
  renderQuiz();
}

function quizRetry() {
  quiz = buildQuiz(quiz.storyIndex);
  currentStory = STORIES[quiz.storyIndex];
  startQuiz();
}

function quizBackToStory() {
  quizCloseConfirm();
  openTextReader(quiz ? quiz.storyIndex : 0);
}

function isAnswered(i) {
  const it = quiz.items[i], a = quiz.answers[i];
  if (it.type === 'mc') return a != null;
  if (it.type === 'open') return a.trim().length > 0;
  return a.every(x => x != null);
}

function quizGo(delta) {
  saveOpenAnswer();
  quiz.index = Math.max(0, Math.min(quiz.items.length - 1, quiz.index + delta));
  quizSelectedWord = null;
  renderQuiz();
}

function quizJump(i) {
  saveOpenAnswer();
  quiz.index = i;
  quizSelectedWord = null;
  renderQuiz();
}

function saveOpenAnswer() {
  const ta = document.getElementById('quiz-open-input');
  if (ta && quiz.items[quiz.index].type === 'open') quiz.answers[quiz.index] = ta.value;
}

function renderQuizDots() {
  const dots = document.getElementById('quiz-dots');
  dots.innerHTML = '';
  quiz.items.forEach((_, i) => {
    const d = document.createElement('button');
    d.className = 'quiz-dot' + (isAnswered(i) ? ' answered' : '') + (i === quiz.index ? ' current' : '');
    d.textContent = i + 1;
    d.onclick = () => quizJump(i);
    dots.appendChild(d);
  });
}

function renderQuiz() {
  renderQuizDots();
  const it = quiz.items[quiz.index];
  const card = document.getElementById('quiz-card');
  card.innerHTML = '';
  // restart the entrance animation
  card.style.animation = 'none';
  void card.offsetWidth;
  card.style.animation = '';

  const kind = document.createElement('div');
  kind.className = 'quiz-kind';
  kind.textContent = `שְׁאֵלָה ${quiz.index + 1} מִתּוֹךְ ${quiz.items.length} • ${QUIZ_KIND_LABELS[it.type]}`;
  card.appendChild(kind);

  const q = document.createElement('div');
  q.className = 'quiz-q';
  q.textContent = it.q;
  card.appendChild(q);

  if (it.type === 'mc') renderMcQuestion(card, it);
  else if (it.type === 'open') renderOpenQuestion(card, it);
  else renderFillQuestion(card, it);

  const last = quiz.index === quiz.items.length - 1;
  document.getElementById('quiz-prev').disabled = quiz.index === 0;
  document.getElementById('quiz-next').style.display = last ? 'none' : '';
  document.getElementById('quiz-submit').style.display = last ? '' : 'none';
}

function renderMcQuestion(card, it) {
  const wrap = document.createElement('div');
  wrap.className = 'quiz-options';
  it.options.forEach((opt, i) => {
    const b = document.createElement('button');
    b.className = 'quiz-option' + (quiz.answers[quiz.index] === i ? ' selected' : '');
    const letter = document.createElement('span');
    letter.className = 'quiz-letter';
    letter.textContent = QUIZ_LETTERS[i];
    const text = document.createElement('span');
    text.textContent = opt.text;
    b.appendChild(letter);
    b.appendChild(text);
    b.onclick = () => {
      quiz.answers[quiz.index] = i;
      wrap.querySelectorAll('.quiz-option').forEach((el, j) => el.classList.toggle('selected', j === i));
      renderQuizDots();
    };
    wrap.appendChild(b);
  });
  card.appendChild(wrap);
}

function renderOpenQuestion(card, it) {
  const ta = document.createElement('textarea');
  ta.id = 'quiz-open-input';
  ta.className = 'quiz-textarea';
  ta.placeholder = 'כִּתְבוּ כָּאן אֶת הַתְּשׁוּבָה...';
  ta.value = quiz.answers[quiz.index];
  ta.oninput = () => {
    const was = isAnswered(quiz.index);
    quiz.answers[quiz.index] = ta.value;
    if (was !== isAnswered(quiz.index)) renderQuizDots();
  };
  card.appendChild(ta);
  const hint = document.createElement('div');
  hint.className = 'quiz-hint';
  hint.textContent = 'טִיפּ: עֲנוּ בְּמִשְׁפָּט מָלֵא וְהַזְכִּירוּ פְּרָטִים מֵהַסִּפּוּר.';
  card.appendChild(hint);
}

function wordText(it, id) {
  return it.bank.find(w => w.id === id).text;
}

function makeChip(it, id, fromSlot) {
  const chip = document.createElement('span');
  chip.className = 'fill-chip' + (fromSlot == null && quizSelectedWord === id ? ' selected' : '');
  chip.textContent = wordText(it, id);
  chip.addEventListener('pointerdown', e => onChipPointerDown(e, id, fromSlot));
  return chip;
}

function renderFillQuestion(card, it) {
  const ans = quiz.answers[quiz.index];

  const bank = document.createElement('div');
  bank.className = 'fill-bank';
  bank.id = 'fill-bank';
  const label = document.createElement('div');
  label.className = 'fill-bank-label';
  label.textContent = 'מַחְסַן מִלִּים';
  bank.appendChild(label);
  it.bank.forEach(w => {
    if (!ans.includes(w.id)) bank.appendChild(makeChip(it, w.id, null));
  });
  card.appendChild(bank);

  const list = document.createElement('div');
  list.className = 'fill-sentences';
  it.sentences.forEach((s, si) => {
    const row = document.createElement('div');
    row.className = 'fill-sentence';
    const num = document.createElement('span');
    num.className = 'fill-num';
    num.textContent = (si + 1) + '.';
    row.appendChild(num);
    const [before, after] = s.text.split('___');
    row.appendChild(document.createTextNode(before));
    const slot = document.createElement('span');
    slot.className = 'fill-slot' + (quizSelectedWord != null && ans[si] == null ? ' ready' : '');
    slot.dataset.slot = si;
    if (ans[si] != null) slot.appendChild(makeChip(it, ans[si], si));
    slot.addEventListener('click', () => {
      if (quizSelectedWord != null && ans[si] == null) placeWord(si, quizSelectedWord, null);
    });
    row.appendChild(slot);
    row.appendChild(document.createTextNode(after || ''));
    list.appendChild(row);
  });
  card.appendChild(list);
}

function placeWord(slot, wordId, fromSlot) {
  const ans = quiz.answers[quiz.index];
  const prev = ans[slot];
  if (fromSlot != null) ans[fromSlot] = (prev != null && fromSlot !== slot) ? prev : null; // swap
  ans[slot] = wordId;
  quizSelectedWord = null;
  renderQuiz();
}

function onChipPointerDown(e, wordId, fromSlot) {
  if (e.button != null && e.button > 0) return;
  e.preventDefault();
  e.stopPropagation();
  quizDrag = { wordId, fromSlot, src: e.currentTarget, x0: e.clientX, y0: e.clientY, ghost: null, over: null };
  window.addEventListener('pointermove', onChipDragMove);
  window.addEventListener('pointerup', onChipDragEnd);
  window.addEventListener('pointercancel', onChipDragEnd);
}

function slotAt(x, y) {
  const el = document.elementFromPoint(x, y);
  return el ? el.closest('.fill-slot') : null;
}

function onChipDragMove(e) {
  const d = quizDrag;
  if (!d) return;
  if (!d.ghost) {
    if (Math.hypot(e.clientX - d.x0, e.clientY - d.y0) < 8) return;
    d.ghost = d.src.cloneNode(true);
    d.ghost.classList.add('drag-ghost');
    d.ghost.classList.remove('selected');
    document.body.appendChild(d.ghost);
    d.src.classList.add('dragging');
    d.scrollTimer = setInterval(quizDragAutoScroll, 16);
  }
  d.x = e.clientX;
  d.y = e.clientY;
  d.ghost.style.left = d.x + 'px';
  d.ghost.style.top = d.y + 'px';
  updateDragOver();
}

function updateDragOver() {
  const d = quizDrag;
  const over = slotAt(d.x, d.y);
  if (over !== d.over) {
    if (d.over) d.over.classList.remove('over');
    if (over) over.classList.add('over');
    d.over = over;
  }
}

// Scroll the question while a word is held near its top or bottom edge
function quizDragAutoScroll() {
  const d = quizDrag;
  if (!d) return;
  const sc = document.querySelector('.quiz-scroll');
  const r = sc.getBoundingClientRect();
  const edge = 70;
  let dy = 0;
  if (d.y > r.bottom - edge) dy = Math.min(edge, d.y - (r.bottom - edge));
  else if (d.y < r.top + edge) dy = -Math.min(edge, (r.top + edge) - d.y);
  if (dy) {
    sc.scrollTop += dy / 5;
    updateDragOver();
  }
}

function onChipDragEnd(e) {
  window.removeEventListener('pointermove', onChipDragMove);
  window.removeEventListener('pointerup', onChipDragEnd);
  window.removeEventListener('pointercancel', onChipDragEnd);
  const d = quizDrag;
  quizDrag = null;
  if (!d) return;
  clearInterval(d.scrollTimer);
  const ans = quiz.answers[quiz.index];

  if (!d.ghost) {
    // A tap: a word in a slot goes back to the bank; a bank word gets selected
    if (d.fromSlot != null) {
      ans[d.fromSlot] = null;
    } else {
      quizSelectedWord = quizSelectedWord === d.wordId ? null : d.wordId;
    }
    renderQuiz();
    return;
  }

  d.ghost.remove();
  const target = e.type === 'pointerup' ? (d.over || slotAt(e.clientX, e.clientY)) : null;
  if (target) {
    placeWord(Number(target.dataset.slot), d.wordId, d.fromSlot);
  } else {
    if (d.fromSlot != null) ans[d.fromSlot] = null; // dragged out of a slot: back to the bank
    renderQuiz();
  }
}

// ----- submit & grading -----
function quizTrySubmit() {
  saveOpenAnswer();
  const missing = quiz.items.filter((_, i) => !isAnswered(i)).length;
  if (missing === 0) return quizSubmit();
  document.getElementById('quiz-confirm-text').textContent =
    missing === 1 ? 'נִשְׁאֲרָה עוֹד שְׁאֵלָה אַחַת בְּלִי תְּשׁוּבָה. לִבְדֹּק בְּכָל זֹאת?'
                  : `נִשְׁאֲרוּ עוֹד ${missing} שְׁאֵלוֹת בְּלִי תְּשׁוּבָה. לִבְדֹּק בְּכָל זֹאת?`;
  document.getElementById('quiz-confirm').classList.add('show');
}

function quizCloseConfirm() {
  document.getElementById('quiz-confirm').classList.remove('show');
}

// Strip nikud, punctuation and final letters so keyword stems match free text
function normalizeHebrew(str) {
  return str
    .replace(/[֑-ׇ]/g, '')
    .replace(/ך/g, 'כ').replace(/ם/g, 'מ').replace(/ן/g, 'נ').replace(/ף/g, 'פ').replace(/ץ/g, 'צ')
    .replace(/[^א-ת\s]/g, ' ')
    .replace(/\s+/g, ' ')
    .trim();
}

function gradeItem(it, a) {
  if (it.type === 'mc') {
    return a != null && it.options[a].correct ? QUIZ_POINTS : 0;
  }
  if (it.type === 'open') {
    const text = normalizeHebrew(a || '');
    if (text.split(' ').filter(Boolean).length < 3) return 0;
    const hits = it.keywords.filter(group => group.some(stem => text.includes(stem))).length;
    if (hits >= it.need) return QUIZ_POINTS;
    return hits > 0 ? QUIZ_POINTS / 2 : 0;
  }
  const right = it.sentences.filter((s, i) => a[i] != null && wordText(it, a[i]) === wordText(it, s.answerId)).length;
  return right * QUIZ_POINTS / it.sentences.length;
}

function quizSubmit() {
  quizCloseConfirm();
  saveOpenAnswer();
  quiz.submitted = true;
  const scores = quiz.items.map((it, i) => gradeItem(it, quiz.answers[i]));
  const total = Math.round(scores.reduce((s, x) => s + x, 0) * 100 / (quiz.items.length * QUIZ_POINTS));

  const story = STORIES[quiz.storyIndex];
  if (!state.quizBest) state.quizBest = {};
  if (getQuizBest(story.id) == null || total > state.quizBest[story.id]) state.quizBest[story.id] = total;
  saveState();

  showScreen('quizResults');
  document.getElementById('quiz-results-screen').scrollTop = 0;
  document.getElementById('quiz-score').innerHTML =
    `<div class="quiz-score-num">${total}</div><div class="quiz-score-of">מִתּוֹךְ 100</div>`;
  const msg = total >= 90 ? 'מַדְהִים! אַלּוּף הַקְּרִיאָה! 🏆'
    : total >= 75 ? 'כָּל הַכָּבוֹד! עֲבוֹדָה מְצֻיֶּנֶת! 🌟'
    : total >= 55 ? 'יָפֶה מְאוֹד! עוֹד קְצָת וְאַתָּה שָׁם 💪'
    : 'לֹא נוֹרָא! כְּמוֹ אֵרִיק: עוֹד צַעַד אֶחָד, וְנַסֶּה שׁוּב 🐾';
  document.getElementById('quiz-score-msg').textContent = msg;
  renderQuizReview(scores);
  if (total >= 75) launchFireworks(`${total} נְקוּדוֹת! 🎆`);
}

function reviewLine(label, html) {
  return `<div class="review-line"><span class="review-label">${label}</span> ${html}</div>`;
}

function renderQuizReview(scores) {
  const box = document.getElementById('quiz-review');
  box.innerHTML = '';
  quiz.items.forEach((it, i) => {
    const pts = scores[i];
    const a = quiz.answers[i];
    const el = document.createElement('div');
    el.className = 'review-item ' + (pts === QUIZ_POINTS ? 'good' : pts > 0 ? 'part' : 'bad');
    const icon = pts === QUIZ_POINTS ? '✅' : pts > 0 ? '🟡' : '❌';
    let body = '';
    if (it.type === 'mc') {
      const correct = it.options.find(o => o.correct).text;
      if (a == null) body += reviewLine('לֹא עָנִיתָ.', '');
      else if (it.options[a].correct) body += reviewLine('עָנִיתָ:', `<span class="review-good">${escapeHtml(it.options[a].text)}</span>`);
      else body += reviewLine('עָנִיתָ:', `<span class="review-bad">${escapeHtml(it.options[a].text)}</span>`);
      if (a == null || !it.options[a].correct) body += reviewLine('הַתְּשׁוּבָה הַנְּכוֹנָה:', `<span class="review-good">${escapeHtml(correct)}</span>`);
    } else if (it.type === 'open') {
      body += reviewLine('כָּתַבְתָּ:', a.trim() ? escapeHtml(a.trim()) : '<span class="review-label">(לֹא נִכְתְּבָה תְּשׁוּבָה)</span>');
      body += reviewLine('תְּשׁוּבָה לְדֻגְמָה:', `<span class="review-model">${escapeHtml(it.model)}</span>`);
    } else {
      it.sentences.forEach((s, si) => {
        const correct = wordText(it, s.answerId);
        const chosen = a[si] != null ? wordText(it, a[si]) : null;
        const [before, after] = s.text.split('___').map(escapeHtml);
        let mid;
        if (chosen === correct) mid = `<span class="review-good">${escapeHtml(correct)}</span>`;
        else mid = (chosen ? `<span class="review-bad">${escapeHtml(chosen)}</span> ` : '') +
                   `<span class="review-good">${escapeHtml(correct)}</span>`;
        body += `<div class="review-line">${chosen === correct ? '✓' : '✗'} ${before}${mid}${after || ''}</div>`;
      });
    }
    const ptsText = Number.isInteger(pts) ? pts : pts.toFixed(1);
    el.innerHTML = `<div class="review-head"><span>${icon} שְׁאֵלָה ${i + 1}</span>` +
      `<span class="review-points">${ptsText} / ${QUIZ_POINTS}</span></div>` +
      `<div class="review-q">${escapeHtml(it.q)}</div>${body}`;
    box.appendChild(el);
  });
}

document.getElementById('text-scroll').addEventListener('scroll', onTextScroll, { passive: true });

// ===== INIT =====
renderStartScreen();
</script>
